# Mission mode: Sun referencing. Three-axis Sun-pointing hold: the power face
# (product sun_axis_body) on the Sun, the product's roll axis on the orbit
# normal. Full navigation: Sun sensors, magnetometer, gyro and star tracker in
# the MEKF. The control structure is the nadir one; only the guidance differs.
schema = "adcs-mode/1"
id = "sun_referencing"
order = 3
label = "Sun referencing"
goal = "Power face on the Sun, three-axis, with star-tracker navigation"
navigation = ["sun", "magnetometer", "gyro", "star_tracker"]
objective = "sun_ape_p9973"
guidance = "sun"
next = "nadir_pointing"
exit = "commanded (schedule / ground)"

[test]
duration_orbits = 1.0
window = "last_half_orbit"
attitude = { kind = "error_from_guidance", angle_deg = 20.0, axis_body = [0.577, 0.577, 0.577] }
rate = { kind = "guidance", extra_deg_s = 0.2 }

[[metrics]]
id = "sun_ape_p9973"
kind = "sun_angle"
window = "last_half_orbit"
statistic = "p99.73"
limit = 5.0
[[metrics]]
id = "ape_3ax_p9973"
kind = "ape"
window = "last_half_orbit"
statistic = "p99.73"
[[metrics]]
id = "ake_3ax_p9973"
kind = "ake"
window = "last_half_orbit"
statistic = "p99.73"
[[metrics]]
id = "rate_stability_p9973"
kind = "rate_stability"
window = "last_half_orbit"
statistic = "p99.73"
[[metrics]]
id = "jitter"
kind = "jitter"
window = "last_half_orbit"
[[metrics]]
id = "momentum_peak"
kind = "wheel_momentum_peak"
window = "all"
[[metrics]]
id = "power_mean"
kind = "power_mean"
window = "all"
requirement = "req.pavg"
[[metrics]]
id = "power_peak"
kind = "power_peak"
window = "all"
[[metrics]]
id = "propellant"
kind = "propellant"
window = "all"

[[options]]
id = "mtq"
actuator = "mtq"
family = "mtq"
fsw_mode = "sun_mtq"
dt_s = 0.2
duration_orbits = 2.0
window = "last_orbit"
[[options]]
id = "rw+mtq"
actuator = "rw"
dump = "mtq"
family = "mtq_rw"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "rw+rcs"
actuator = "rw"
dump = "rcs"
family = "mtq_rw_rcs"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "cmg+mtq"
actuator = "cmg"
dump = "mtq"
family = "mtq_cmg"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "cmg+rcs"
actuator = "cmg"
dump = "rcs"
family = "mtq_cmg_rcs"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "vscmg+mtq"
actuator = "vscmg"
dump = "mtq"
family = "mtq_vscmg"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "vscmg+rcs"
actuator = "vscmg"
dump = "rcs"
family = "mtq_vscmg_rcs"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "fmr+mtq"
actuator = "fmr"
dump = "mtq"
family = "mtq_fmr"
fsw_mode = "sun_fine"
dt_s = 0.1
[[options]]
id = "fmr+rcs"
actuator = "fmr"
dump = "rcs"
family = "mtq_fmr_rcs"
fsw_mode = "sun_fine"
dt_s = 0.1
