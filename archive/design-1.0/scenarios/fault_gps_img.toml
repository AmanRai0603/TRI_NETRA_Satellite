# Imaging 3U: the GNSS receiver goes silent for 30 minutes in fine hold; the flight software
# propagates its orbit and keeps pointing; judged as the fine hold is.
schema = "adcs-scenario/1"
id = "fault_gps_img"
label = "3U imaging — fine hold through a 30 min GNSS outage"
case = "ais_img_3u"
product = "TRN-P-3U-IMG"
[time]
duration_s = 5740.0
dt_s = 0.1
record_dt_s = 0.1
[initial]
attitude = { kind = "error_from_target", angle_deg = 2.0, axis_body = [0.577, 0.577, 0.577] }
rate = { kind = "lvlh" }
[fsw]
start_mode = "nadir_fine"
guidance = { kind = "nadir" }
rw_bandwidth = 0.9
rw_damping = 2.0
[[faults]]
kind = "gps_outage"
t_s = 2000.0
end_s = 3800.0
[[metrics]]
id = "ape_los_p9973"
kind = "ape_los"
window = "last_half_orbit"
statistic = "p99.73"
requirement = "req.ape"
[[metrics]]
id = "ake_los_p9973"
kind = "ake_los"
window = "last_half_orbit"
statistic = "p99.73"
requirement = "req.ake"
[[metrics]]
id = "power_mean"
kind = "power_mean"
window = "all"
requirement = "req.pavg"
