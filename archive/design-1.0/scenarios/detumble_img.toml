# Imaging 3U: B-dot detumble with the coils (wheels idle at their bias).
schema = "adcs-scenario/1"
id = "detumble_img"
label = "3U imaging — B-dot detumble from a 10 deg/s tumble"
case = "ais_img_3u"
product = "TRN-P-3U-IMG"
[time]
duration_s = 17220.0
dt_s = 0.1
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = "case:mission.w0" }
[fsw]
start_mode = "detumble"
guidance = { kind = "nadir" }
bdot_gain_scale = 3.0
[[metrics]]
id = "detumble_time"
kind = "time_to_rate"
rate_threshold_deg_s = 0.5
hold_s = 600.0
requirement = "req.detumble"
