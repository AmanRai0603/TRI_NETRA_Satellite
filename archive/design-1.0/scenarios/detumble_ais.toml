# AIS 3U: detumble from separation with coils only (B-dot), then hold.
schema = "adcs-scenario/1"
id = "detumble_ais"
label = "3U AIS — B-dot detumble from a 10 deg/s tumble (coils only)"
case = "ais_3u"
product = "TRN-P-3U-AIS"
[time]
duration_s = 17220.0          # three orbits at 550 km (95.65 min)
dt_s = 0.2                    # magnetic control is slow; the 1 s coil duty still resolves
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = "case:mission.w0" }
[fsw]
start_mode = "detumble"
guidance = { kind = "nadir" }
bdot_gain_scale = 3.0
[[metrics]]
id = "detumble_time"
kind = "time_to_rate"
rate_threshold_deg_s = 0.5
hold_s = 600.0
requirement = "req.detumble"
[[metrics]]
id = "power_mean"
kind = "power_mean"
window = "all"
requirement = "req.pavg"
[[metrics]]
id = "power_peak"
kind = "power_peak"
window = "all"
requirement = "req.ppk"
