  <title id="t">Who runs what: languages and layers</title>
  <desc id="d">TRI-NETRA ADCS layers: pseudocode contract; C99 and Rust no_std flight software sharing one ABI; the byte-level HAL; the four places flight software runs over adcs-link/1; the Rust engine crates; Python tools; the MATLAB/Octave twin; and the outputs.</desc>
