what = "Each group's code, generated from its nodes (docs/RELEASE_PLAN.md P10, docs/GENERATORS.md): wire puts every computing row's pseudocode into a module per group (design/groups/, with shared.pc for what several groups call alike, and a wire file naming each row's function and its own test vectors), from the merged releases or from the design as seeded and carried; gen translates them to Rust (engine/crates/adcs-groups), WebAssembly (adcs-groups-wasm) and MATLAB (+asils/+groups) with the interpreter's vectors; test runs the Rust against the vectors and the nodes' own test vectors; deliver builds a test app per group."
steps = ["wire: read the design's nodes, group their pseudocode, refuse a function written two ways", "gen: translate with the pseudocode's translators, draw vectors in the interpreter", "test: cargo test -p adcs-groups", "deliver: build the WebAssembly module and one offline test app per group"]
