name = "manual"
usage = "python3 tools/manual.py [--check]"
what = "The apps' manual (design/manual/: a guide per role, the journey of a node, the glossary, the guide to TRI-NETRA Files, and the tours in tours.toml) written as design/js/manual.js, which every app opens in place with Help, and the journey diagram as design/manual/journey.svg. --check says whether both are current and holds the rules: every page starts with its one line (the explanation standard), every tour target is in its app, every field, choice and set of checks in the apps has help beside it."
steps = ["read the manual pages and the tours", "draw the journey", "write design/js/manual.js and design/manual/journey.svg (or, with --check, compare)", "check the rules"]
reads = ["design/manual/", "design/js/*_app.js", "design/js/node_model.js"]
writes = ["design/js/manual.js", "design/manual/journey.svg"]
runs = []
checks = "--check: the manual's pages, tours and field help (see what)"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "node_catalog.py"
name = "node_catalog"
usage = "python3 tools/node_catalog.py [--check]"
what = "The node app's catalogue (design/js/node_catalog.js), written from the spec: the units and the quantities each measures, the physics relations, the sources, the evidence metrics and rungs, the provenance and belief words, the tags and every row of the tree with its label, kind, quantity, unit and layer. The node app offers these as its choices, so they are never typed by hand. --check says whether the committed file is current."
steps = ["read the spec's units, quantities, physics, sources, evidence vocabulary and tree", "write design/js/node_catalog.js (or, with --check, compare)"]
reads = ["spec/"]
writes = ["design/js/node_catalog.js"]
runs = []
checks = "--check: the committed catalogue is current"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "release.py"
name = "release"
usage = "python3 tools/release.py check PATH... | list DIR"
what = "Sealed group releases (releases/<group>-<version>.tnrel, as the group app seals them), checked from Python: each file passes tools/tndb.py check and is named for its group and version; every node's fingerprint, body fingerprint and the release's fingerprint are the SHA-256 of what they cover; its nodes are the group's as sealed, each confirmed or unconfirmed with why; a confirmed node was checked by someone other than its author and, when it computes, has a test vector from outside the code; the lead's seal names the version and the fingerprint. The same rules as design/js/release.js, written a second time."
steps = ["find the release files (under DIR/releases/ for a folder)", "check each one", "list every problem"]
reads = ["DIR/releases/", "PATH"]
writes = []
runs = []
checks = "each release file's fingerprints, its nodes, the confirmed rule and the seal"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "drive_pack.py"
name = "drive-pack"
usage = "python3 tools/drive_pack.py [--out DIR] [--rev REV]"
what = "The Drive pack: the two offline apps (TRI-NETRA Files, TRI-NETRA Group) and the design seeded from the spec (20 group files, 734 node files), in the layout the shared Drive folder of the design takes, with a README. CI builds it on every push as the trinetra-drive-pack artifact."
steps = ["build the offline pages", "seed the design", "check every design file", "write the README"]
reads = ["design/", "spec/plan/"]
writes = ["dist/trinetra-drive-pack/"]
runs = []
checks = "the seeded and carried design checks"
undo = "Delete dist/trinetra-drive-pack/."
