# Every command in this repository: what it is for, the steps it takes, what it reads,
# what it writes and which programs it starts. One definition, read by
#   python3 tools/trinetra.py list | explain <command>     (and --dry-run on engine.py and pipeline.py)
# and turned into docs/COMMANDS.md by `python3 tools/trinetra.py docs` (checked by `docs --check`).
# tests/test_commands.py holds it to the code: every subcommand a tool has is here, and nothing
# here is missing from the tool.
#
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.

# ---------------------------------------------------------------- the engine (Rust)

[[command]]
tool = "adcs"
name = "run"
usage = "adcs run <scenario> [--case F] [--fsw c|rust|obc-posix|qemu|...] [--seed N] [--out DIR] [--set k=v]... [--oils] [--quiet]"
what = "Fly one scenario on one case: the plant, the environment and the POP orbit in Rust, the flight software (C or Rust, or a virtual OBC) behind the byte HAL, then the metrics and their verdicts."
steps = ["check the scenario id, the case and every --set (refused by name, never guessed)", "build the configuration: case + scenario + product, the flight-software parameters", "fly the closed loop for the scenario's duration", "derive the metrics and judge them against the case's requirements", "keep the case and scenario files it flew, once each by fingerprint, in the store's inputs/", "write channels.csv, then manifest.json with the run's provenance (engine source, case, scenario and product fingerprints)", "apply the store's retention when the run went into the store (a kit: time series older than 30 days, pinned runs aside; TRINETRA_RETENTION_DAYS)"]
reads = ["matlab_sils/data/scenarios/<scenario>.json", "matlab_sils/cases/<case>.csv", "matlab_sils/data/products, parts, algorithms", "matlab_sils/pop/.../de440s.bsp"]
writes = ["matlab_sils/store/results_engine/<scenario>/ (or --out): channels.csv, manifest.json", "matlab_sils/store/inputs/ (or <out>/inputs/)"]
runs = []
checks = "the scenario id, the case keys and every --set exist and are in range (refused by name, never guessed); the metrics against the case's requirements"
undo = "Delete the run folder it wrote (the store's index forgets it at the next `adcs results list`); the inputs it kept by fingerprint are shared and harmless to leave."

[[command]]
tool = "adcs"
name = "params"
usage = "adcs params <scenario> [--case F] [--set k=v]... --out blob.bin"
what = "The flight software's parameter blob (adcs-fswcfg/1) for a scenario, as an OBC boots from it."
steps = ["build the configuration as `adcs run` does", "encode the parameters with their CRC-32"]
reads = ["the scenario, the case, the product"]
writes = ["the --out file"]
runs = []
checks = "the scenario, case and product exist; the blob's CRC-32"
undo = "Delete the --out file."

[[command]]
tool = "adcs"
name = "size"
usage = "adcs size <case> [--knobs k.json] [--out DIR]"
what = "The demand survey on the case's orbit, then every actuator option sized to it (magnetorquers, fluid loop, RCS, wheels, CMG, VSCMG)."
steps = ["check the case id", "fly the one-orbit survey to find the disturbance torque and momentum demand", "size every option with the knobs, pick bought wheels and CMGs from the datasheet catalogue", "write the sized parts, products and the summary"]
reads = ["matlab_sils/cases/<case>.csv", "matlab_sils/data/catalogue, parts, families.json"]
writes = ["matlab_sils/store/design/<case>/sized/ (or --out): parts/, products/, sizing.json"]
runs = []
checks = "the case id; every bought part against the datasheet catalogue"
undo = "Delete the sized/ folder it wrote."

[[command]]
tool = "adcs"
name = "parity"
usage = "adcs parity <scenario> [--fsw A --against B] [--set k=v]..."
what = "Fly the same scenario with two flight-software targets and report the largest difference in attitude and rate; bit-identical is the expected answer for C and Rust, and any difference exits with status 1."
steps = ["fly the loop with target A", "fly it with target B", "compare every recorded step"]
reads = ["as `adcs run`"]
writes = []
runs = ["the virtual OBC or QEMU, when a target names one"]
checks = "the two flight-software targets give the same attitude and rate within the stated tolerance"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "adcs"
name = "results"
usage = "adcs results list [DIR] | show <run> | pin|unpin <run> | thin --older-than DAYS [DIR] [--dry-run] | export <run> --out F.trinetra | import F.trinetra --out DIR | query --sql SELECT [DIR] | stale [DIR] | refly <run> [--out DIR] [--fsw T]"
what = "The results store: every run with its provenance, one line each; one run in full; runs kept (pinned) or thinned to their manifest when old; a run as one share file, and back; any read-only question to its SQLite index; the runs another engine or other inputs flew; a stored run flown again with what changed."
steps = ["list: find every manifest.json (adcs-rec/1) under the folder, reading only those new or changed since its index (.adcs-index.sqlite), then bring the index to exactly what is there", "show: print the run's provenance and requirement metrics and the command that flies it again, from the inputs it kept", "pin: mark a run to keep; thin: remove the bulk (channels.csv, the twin's rec.mat and run_*.mat) of unpinned runs older than DAYS, keeping every manifest", "export: write README, manifest, channels and the kept inputs into one zip", "import: check every entry's name and checksum, then write them into the folder", "query: bring the index up to date, then run one read-only SQL statement on its runs and metrics tables", "stale: compare every run's engine source, case, scenario and product fingerprints with today's and name what differs; exit 1 when any run is stale", "refly: fly the run again from its kept inputs into <store>/refly/<run> and print every metric stored against now"]
reads = ["matlab_sils/store/results_engine/ (or DIR)", "the case, scenario and product files the runs name (stale)", "the run's kept inputs (refly)"]
writes = ["list, query, stale: <folder>/.adcs-index.sqlite; pin: <run>/PINNED; thin: removes the bulk files; export: the .trinetra file; import: the folder; refly: <store>/refly/<run>/ (or --out)"]
runs = []
checks = "each stored run's provenance against the engine and inputs that made it (stale when they changed)"
undo = "list/query/stale: nothing (the index is rebuilt from the runs). pin: delete <run>/PINNED. thin: a thinned time series is gone; fly the run again."

[[command]]
tool = "adcs"
name = "figures"
usage = "adcs figures RUN_DIR --out DIR [--format svg|pdf] [--full] [--prefix P]"
what = "A run's figures, the same for an engine run and a MATLAB twin run (both keep manifest.json and channels.csv with the same columns): attitude, disturbance torques, actuators and power, the Sun spin when the run spun up, and with --full the environment, ground track and mode timeline. Drawn by adcs-plot, the one plotting module, as SVG or PDF."
steps = ["read the run's manifest.json and channels.csv (a thinned run is refused with how to fly it again)", "build each figure, with the case's requirement lines from the manifest's metrics", "thin long series to the smallest and largest sample per pixel column", "write <prefix>_<n>_<name>.svg (or .pdf) into DIR and print each file"]
reads = ["RUN_DIR/manifest.json", "RUN_DIR/channels.csv"]
writes = ["DIR/<prefix>_<n>_<name>.svg|pdf (prefix: the run folder's name)"]
runs = []
checks = "the run folder holds manifest.json and channels.csv (a thinned run is refused with `adcs results refly`); every figure is well-formed SVG or PDF"
undo = "Delete the files it wrote into DIR; the run is only read."

[[command]]
tool = "adcs"
name = "report"
usage = "adcs report RUN_DIR [--out DIR]"
what = "A run's report: what it flew (scenario, case, product, flight software, seed, duration, engine, result id, input fingerprints), every metric against its requirement with the verdict, and every figure of `adcs figures --full`; as HTML with the figures inline (a print stylesheet, so a browser prints it to PDF) and as PDF."
steps = ["read the run as `adcs figures` does", "draw the full figure set", "write report.html (figures inline as SVG) and report.pdf (a page of provenance and verdicts, then a page per figure)"]
reads = ["RUN_DIR/manifest.json", "RUN_DIR/channels.csv"]
writes = ["DIR (default RUN_DIR)/report.html", "DIR (default RUN_DIR)/report.pdf"]
runs = []
checks = "as for figures; the verdict table is the manifest's own metrics, nothing recomputed"
undo = "Delete report.html and report.pdf from the run folder (or --out); the run is only read."

[[command]]
tool = "adcs"
name = "plot"
usage = "adcs plot SPEC.json --out FILE.svg|FILE.pdf"
what = "Figures described as JSON (panels stacked or in a grid; line, step, scatter, histogram and horizontal-bar series; reference lines, notes, legends; linear or log axes), drawn by adcs-plot. The report tools describe every campaign, comparison, trade and solution figure this way; the schema is in engine/crates/adcs-plot/src/lib.rs."
steps = ["read the description; an unknown kind, scale or layout is refused by name", "lay out the panels, ticks and series", "write one SVG (several figures: FILE_1.svg, FILE_2.svg, ...) or one PDF with a page per figure"]
reads = ["SPEC.json"]
writes = ["the --out file"]
runs = []
checks = "the JSON description: every kind, scale, layout, limit and grid named and valid (anything else refused with exit 2, by name)"
undo = "Delete the --out file(s)."

# ---------------------------------------------------------------- orchestration (Python)

[[command]]
tool = "engine.py"
name = "build"
usage = "python3 tools/engine.py build"
what = "Build and test everything that flies: the C flight software, the Rust flight software (host and Cortex-M), the virtual OBC firmware and the Rust engine."
steps = ["make clean, make test and make check in fsw/ (the C flight software's checks)", "cargo test the Rust flight software", "build its C-ABI library for the host and for thumbv7em-none-eabihf", "make obc: the virtual OBC firmware (process and QEMU) and the instruction plugin", "cargo test and cargo build --release the engine"]
reads = ["fsw/, fsw-rs/, engine/"]
writes = ["fsw/build/, fsw-rs/target/, engine/target/"]
runs = ["make", "gcc", "arm-none-eabi-gcc", "cargo"]
checks = "every build with warnings as errors; the flight software's tests"
undo = "Delete the build folders (fsw/build/, fsw-rs/target/, engine/target/); nothing else changes."

[[command]]
tool = "engine.py"
name = "run"
usage = "python3 tools/engine.py run [scenario ...] [--fsw c|rust] [--jobs N] [--seed S]"
what = "Fly scenarios on the engine in parallel (every scenario when none is named)."
steps = ["one `adcs run` per scenario, on --jobs processes", "print each run's verdicts"]
reads = ["matlab_sils/data/scenarios/"]
writes = ["matlab_sils/store/results_engine/<scenario>/"]
runs = ["adcs run"]
checks = "as `adcs run`, for each scenario"
undo = "Delete the run folder it wrote (the store's index forgets it at the next `adcs results list`); the inputs it kept by fingerprint are shared and harmless to leave."

[[command]]
tool = "engine.py"
name = "mc"
usage = "python3 tools/engine.py mc <scenario> --seeds N [--fsw c|rust] [--jobs N]"
what = "A seed sweep of one scenario: the same scenario flown with N sensor-noise seeds."
steps = ["one `adcs run` per seed", "summarise every metric over the seeds"]
reads = ["the scenario and its case"]
writes = ["matlab_sils/store/results_engine/mc_<scenario>/summary.json"]
runs = ["adcs run"]
checks = "the seed sweep's spread against the scenario's requirements"
undo = "Delete matlab_sils/store/results_engine/mc_<scenario>/."

[[command]]
tool = "engine.py"
name = "fsw-parity"
usage = "python3 tools/engine.py fsw-parity [scenario ...] [--duration S]"
what = "C against Rust flight software on the same loop, same bytes, scenario by scenario."
steps = ["fly each scenario with the C and the Rust flight software (`adcs parity`)", "print the largest differences"]
reads = ["the scenarios"]
writes = []
runs = ["adcs parity"]
checks = "the C and Rust flight software give the same numbers, bit for bit where stated"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "engine.py"
name = "twin-parity"
usage = "python3 tools/engine.py twin-parity"
what = "The engine's metrics against the MATLAB twin's, scenario by scenario and metric by metric."
steps = ["read each scenario's engine and twin manifests and pair their metrics", "tabulate verdict agreement and ratios, and write the ledger"]
reads = ["matlab_sils/store/results_engine/", "matlab_sils/store/results/"]
writes = ["results/ENGINE_PARITY.md", "results/engine_parity.json"]
runs = []
checks = "the engine's metrics against the MATLAB twin's, within each metric's tolerance"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "vobc"
usage = "python3 tools/engine.py vobc [scenario ...] [--duration S]"
what = "The flight software as a separate process and as Cortex-M4 firmware in QEMU, over adcs-link/1, compared with the in-process builds."
steps = ["build the virtual OBC firmware (make obc)", "fly each scenario in-process and on each virtual OBC with `adcs parity`, which compares the trajectories", "write results/VIRTUAL_OBC.md"]
reads = ["the scenarios", "fsw/build/ (the OBC firmware)"]
writes = ["results/VIRTUAL_OBC.md"]
runs = ["adcs parity", "qemu-system-arm"]
checks = "the flight software as a process and as QEMU firmware against the in-process run"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "dispatch"
usage = "python3 tools/engine.py dispatch [case ...]"
what = "The recommended solution's flight configuration for each case, and a mission check of it on the engine."
steps = ["read the case's recommended solution", "write the mission scenario, the parameter blob and its decoded JSON", "fly the mission with C and with Rust, and write the check and the build notes"]
reads = ["matlab_sils/store/pipeline/<case>/"]
writes = ["dist/dispatch/<case>/<family>/fsw/"]
runs = ["adcs params", "adcs run"]
checks = "the dispatched configuration flies its mission on the engine"
undo = "Delete dist/dispatch/<case>/."

[[command]]
tool = "engine.py"
name = "campaign"
usage = "python3 tools/engine.py campaign [campaign ...] [--fsw c|rust] [--jobs N]"
what = "Every Monte Carlo and edge campaign (or those named) on the engine, with the twin's draws: the same dispersions, bounds, run count and per-run seeds."
steps = ["draw each run's dispersions (the Kp -> ap table included)", "one `adcs run` per run", "summarise the campaign", "rewrite the engine-vs-twin campaign ledger"]
reads = ["matlab_sils/data/campaigns/", "matlab_sils/store/results/<campaign>/summary.json (the twin)"]
writes = ["matlab_sils/store/results_engine/campaigns/<campaign>/", "results/ENGINE_CAMPAIGNS.md", "results/engine_campaigns.json"]
runs = ["adcs run"]
checks = "each campaign's statistics against the twin's"
undo = "Delete the campaign folders it wrote; It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "campaign-ledger"
usage = "python3 tools/engine.py campaign-ledger"
what = "Rewrite the engine-vs-twin campaign ledger from the stored summaries, without flying anything."
steps = ["read every campaign summary, engine and twin", "write the ledger"]
reads = ["matlab_sils/store/results_engine/campaigns/", "matlab_sils/store/results/"]
writes = ["results/ENGINE_CAMPAIGNS.md", "results/engine_campaigns.json"]
runs = []
checks = "the stored summaries are complete"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "oils"
usage = "python3 tools/engine.py oils [scenario ...] [--fsw qemu|qemu-rs] [--duration S] [--cpi C ...] [--jobs N]"
what = "SILS and soft OILS side by side: the flight software as Cortex-M4F firmware, with exact instruction timing and command latency; every soft-OILS run judged on overruns and on its worst-case latency against the deadline; --cpi flies a CPI sweep."
steps = ["build the virtual OBC firmware (make obc)", "fly each scenario in SILS and with --oils on QEMU (and at each --cpi)", "tabulate latency, CPU load, the worst-case deadline margin, the sweep and the metric differences"]
reads = ["the scenarios", "fsw/build/ (the firmware)"]
writes = ["matlab_sils/store/results_engine/soft_oils/", "results/SOFT_OILS.md", "results/soft_oils.json"]
runs = ["adcs run --oils", "qemu-system-arm"]
checks = "every tick within its deadline; soft OILS against SILS"
undo = "Delete matlab_sils/store/results_engine/soft_oils/; It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "oils-ledger"
usage = "python3 tools/engine.py oils-ledger"
what = "Rewrite the soft-OILS ledger from the stored runs, without flying anything."
steps = ["read the stored SILS and OILS runs", "write the ledger"]
reads = ["matlab_sils/store/results_engine/soft_oils/"]
writes = ["results/SOFT_OILS.md", "results/soft_oils.json"]
runs = []
checks = "the stored runs are complete"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "engine.py"
name = "solutions"
usage = "python3 tools/engine.py solutions [case ...] [--seeds 1,2] [--fsw c|rust] [--jobs N]"
what = "The customer-case solution matrix on the engine: every mission mode x option x seed, with the sized products."
steps = ["write each case's mode x option scenarios", "fly every mode, option and seed", "tabulate feasibility and budgets"]
reads = ["matlab_sils/cases/", "matlab_sils/data/modes/"]
writes = ["matlab_sils/store/solutions_engine/", "results/ENGINE_SOLUTIONS.md"]
runs = ["adcs size", "adcs run"]
checks = "every mode and option flown, judged against the case"
undo = "Delete matlab_sils/store/solutions_engine/; It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "pipeline.py"
name = "pipeline"
usage = "python3 tools/pipeline.py [case ...] [--seeds 1,2] [--max-iter 5] [--jobs N] [--mc-runs 12] [--no-oils]"
what = "The design loop, node by node: from a customer case to a selected, dispatched, verified ADCS (docs/DESIGN_LOOP.md)."
steps = ["size: the demand survey and every option sized", "matrix: every mode x option x seed flown with the sized products", "assess: each failing requirement classed (performance, knowledge, power, propellant)", "select: the lightest solution family (then power, then volume) that passes every mode within the mass and volume budget", "converge: resize or upgrade what failed, and repeat from size until nothing is left to change", "faults: each solution family's mission flown once per single fault its hardware can carry; select counts the faults it does not survive", "dispatch: the selected family's flight configuration, checked with C and Rust", "mc: a Monte Carlo of the dispatched mission", "robust: a requirement the Monte Carlo breaks sends the loop back to size with more margin", "family_missions: every solution family's mission flown (SILS C and Rust, and a Monte Carlo)", "certify: the Floquet certificate of each magnetic pointing law", "soft_oils: the dispatched mission on the Cortex-M4F firmware (unless --no-oils)", "ledger: the design ledger and its JSON"]
reads = ["matlab_sils/cases/<case>.csv", "matlab_sils/data/"]
writes = ["matlab_sils/store/pipeline/<case>/<node>.json", "dist/dispatch/<case>/"]
runs = ["adcs size", "adcs run", "adcs params", "qemu-system-arm"]
checks = "each node's inputs, outputs and rules (matlab_sils/data/pipeline/nodes.json); each decision recomputable"
undo = "Delete matlab_sils/store/pipeline/<case>/ and dist/dispatch/<case>/."

# ---------------------------------------------------------------- reports and packages

[[command]]
tool = "report.py"
name = "report"
usage = "python3 tools/report.py"
what = "The results report from the filed runs: figures, verdict tables, the summary and the results documents. It reads; it never flies."
steps = ["read every filed run, campaign and trade", "draw each run's figures with `adcs figures`, and each campaign, comparison, trade and solution figure from its JSON description with `adcs plot` (SVG)", "write the page, the summary and the documents"]
reads = ["matlab_sils/store/results/", "matlab_sils/store/trades/"]
writes = ["results/figures/*.svg", "results/index.html", "results/summary.json", "docs/RESULTS.md", "docs/SELECTION.md"]
runs = ["adcs figures", "adcs plot"]
checks = "every filed run it reads exists and is current"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "vv_report.py"
name = "vv-report"
usage = "python3 tools/vv_report.py"
what = "The downloadable V&V report: the template filled from the filed results, as self-contained HTML and as a PDF."
steps = ["collect every source that exists (a missing one is named, never invented)", "draw its figures with `adcs plot`, inlined as SVG", "fill tools/templates/vv_report.html", "print it to PDF with headless Chromium"]
reads = ["matlab_sils/store/pipeline/", "matlab_sils/store/results_engine/", "matlab_sils/store/results/", "results/*.json"]
writes = ["results/vv/TRINETRA_ADCS_VV_report.html", "results/vv/vv_artifact.html", "dist/TRINETRA_ADCS_VV_report.pdf"]
runs = ["adcs plot", "chromium (headless)"]
checks = "every section of the template is filled from a filed result"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "pack_matlab.py"
name = "pack-matlab"
usage = "python3 tools/pack_matlab.py"
what = "The downloadable MATLAB SILS zip, deterministic (sorted files, fixed timestamps), with its SHA-256 manifest."
steps = ["collect matlab_sils/ and the documents", "write the zip beside its name, then rename it into place"]
reads = ["matlab_sils/", "docs/"]
writes = ["dist/TRINETRA_ADCS_SILS_matlab_<version>.zip"]
runs = []
checks = "the zip is deterministic: its SHA-256 manifest"
undo = "Delete the zip from dist/."

[[command]]
tool = "pack_flight.py"
name = "pack-flight"
usage = "python3 tools/pack_flight.py"
what = "The flight software and Rust engine zip, in the repository's layout so it builds as unpacked."
steps = ["collect fsw/, fsw-rs/, engine/, the data and the tools", "write the zip beside its name, then rename it into place"]
reads = ["fsw/", "fsw-rs/", "engine/", "matlab_sils/data", "tools/"]
writes = ["dist/TRINETRA_ADCS_flight_engine_<version>.zip"]
runs = []
checks = "the zip builds as unpacked"
undo = "Delete the zip from dist/."

# ---------------------------------------------------------------- generators (their outputs are never edited by hand)

[[command]]
tool = "gen_fsw_params.py"
name = "gen-fsw-params"
usage = "python3 tools/gen_fsw_params.py [--check]"
what = "The flight software's parameter and table sources, C and Rust, from their one definition. --check says which generated file is stale, and changes nothing."
steps = ["read fsw/params/params.toml and the IGRF table", "write the C header and source and the Rust module"]
reads = ["fsw/params/params.toml", "matlab_sils/data/igrf13coeffs.txt"]
writes = ["fsw/include/adcs_params.h", "fsw/src/adcs_params.c", "fsw-rs/src/params.rs", "matlab_sils/data/igrf13.json", "fsw/include/adcs_igrf13.h", "fsw-rs/src/igrf13.rs", "fsw/pseudocode/02_igrf13.pc"]
runs = []
checks = "--check: every generated parameter file is its definition"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "fsw_stack.py"
name = "fsw-stack"
usage = "python3 tools/fsw_stack.py"
what = "The flight software's deepest stack on the Cortex-M4 firmware, from GCC's call graph, against the stack the linker script reserves. Recursion and unbounded frames are refused; a library routine is charged a fixed frame and named."
steps = ["compile the firmware sources with -fstack-usage -fcallgraph-info=su", "walk the call graph from Reset_Handler and add the frames along the deepest path", "fail if it is over _stack_size in link.ld"]
reads = ["fsw/src/", "fsw/targets/link/", "fsw/targets/qemu-mps2/"]
writes = []
runs = ["arm-none-eabi-gcc"]
checks = "the deepest call path fits the stack the linker script reserves"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "design_rows.py"
name = "design-rows"
usage = "python3 tools/design_rows.py [--list]"
what = "Every row of the ADCS tree, from the spec package: 734 rows (133 in layer 1, 194 in layer 2, 368 in the subsystem layers, 39 closures), each with its short id, the id its node file carries, its layer, kind, branch and label. Fails when the counts SPEC.md states do not hold or an id repeats."
steps = ["read the spec's tree, KPI list and long-id map", "list every row, naming the subsystem-layer rows", "check the counts and that every id is unique"]
reads = ["spec/plan/tree.json", "spec/plan/kpis.toml", "spec/plan/expected_node_ids.json"]
writes = []
runs = []
checks = "every row exactly once, against the spec's expected ids"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "groups.py"
name = "groups"
usage = "python3 tools/groups.py [--check | --row ID]"
what = "The group map (design/groups.toml) against every row of the tree: each row in exactly one of the 20 discipline groups, each group holding the rows it states, each stage inside its group, every override and boundary naming real rows and groups. --row says where one row goes and why."
steps = ["read the group map and every row", "place each row (override, then its target, then its branch)", "check the placement against the map"]
reads = ["design/groups.toml", "spec/plan/"]
writes = []
runs = []
checks = "every row of the tree in exactly one group; the boundary rules"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "tndb.py"
name = "tndb"
usage = "python3 tools/tndb.py check FILE... | dump FILE | ddl KIND | gen [--check]"
what = "The design files (node, group, release, design database), from design/schema.toml: check a file's format, version and every table; dump it as canonical JSON; print the SQL that makes a kind; write or check the files made from the schema (design/ddl.sql, design/js/tndb_schema.js). An older file is upgraded with a copy kept; a newer one is refused."
steps = ["read the schema", "open each file, checking or upgrading its format", "check, dump, print or generate"]
reads = ["design/schema.toml"]
writes = ["design/ddl.sql", "design/js/tndb_schema.js"]
runs = []
checks = "a file's format, version, tables and columns against design/schema.toml; caps on size and pictures"
undo = "check: nothing, unless it upgraded an older file, which keeps the original beside it (put it back by renaming). gen: It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "seed_design.py"
name = "seed-design"
usage = "python3 tools/seed_design.py [--out DIR | --check]"
what = "Seeds the design files from the spec: a group file for each of the 20 groups, a node file for each of the 734 rows (the 82 the spec seeds with their content, the rest as shells), and the starting design database. Never overwrites; --check seeds into a temporary folder and checks every file."
steps = ["write the group files, the node files and the design database from the spec", "check every file against the schema"]
reads = ["design/groups.toml", "design/schema.toml", "spec/plan/"]
writes = ["build/design/"]
runs = []
checks = "the group map holds; every file it writes checks"
undo = "Delete the folder it wrote (build/design/ or --out). Never run it over a design folder people edit."

[[command]]
tool = "version.py"
name = "version"
usage = "python3 tools/version.py [--check | --set X.Y.Z]"
what = "One version for the repository: VERSION is the source, and the engine's Cargo workspace, the Rust flight software's Cargo package and the C flight software's build id follow it; the Rust build ids are built from their Cargo version. --check fails on any drift; --set writes a new version everywhere."
steps = ["read VERSION and the version each part states", "check the Rust build ids take their Cargo version", "with --set, write the new version into VERSION and every part"]
reads = ["VERSION", "engine/Cargo.toml", "fsw-rs/Cargo.toml", "fsw/src/adcs_fsw.c", "engine/crates/adcs-sim/src/lib.rs", "fsw-rs/src/fsw.rs"]
writes = ["VERSION", "engine/Cargo.toml", "fsw-rs/Cargo.toml", "fsw/src/adcs_fsw.c"]
runs = []
checks = "every part carries the one version"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "mutation.py"
name = "mutation"
usage = "python3 tools/mutation.py [--from DIR] [--check] [--jobs N]"
what = "Mutation testing of the flight software's guidance, control and estimation (fsw-rs/src/guid.rs, ctl.rs, est.rs) with cargo-mutants: each small deliberate fault in turn, and whether the Rust flight software's tests catch it. Writes the kill rate per function and the missed mutants; --check fails under the floor the tool states."
