[[command]]
tool = "groupcode.py"
name = "groupcode"
usage = "python3 tools/groupcode.py wire [--design DIR] [--check] | gen [--check] | test | deliver [--out DIR]"
what = "Each group's code, generated from its nodes (docs/RELEASE_PLAN.md P10, docs/GENERATORS.md): wire puts every computing row's pseudocode into a module per group (design/groups/, with shared.pc for what several groups call alike, and a wire file naming each row's function and its own test vectors), from the merged releases or from the design as seeded and carried; gen translates them to Rust (engine/crates/adcs-groups), WebAssembly (adcs-groups-wasm) and MATLAB (+asils/+groups) with the interpreter's vectors; test runs the Rust against the vectors and the nodes' own test vectors; deliver builds a test app per group."
steps = ["wire: read the design's nodes, group their pseudocode, refuse a function written two ways", "gen: translate with the pseudocode's translators, draw vectors in the interpreter", "test: cargo test -p adcs-groups", "deliver: build the WebAssembly module and one offline test app per group"]
reads = ["DIR/design.tndb or the seeded and carried design", "design/groups/", "design/js/pcode.js, pcode_gen.js"]
writes = ["design/groups/", "engine/crates/adcs-groups/", "engine/crates/adcs-groups-wasm/", "matlab_sils/+asils/+groups/", "matlab_sils/data/groups_vectors.json", "dist/test-apps/ (deliver)"]
runs = ["node", "cargo"]
checks = "wire --check and gen --check: everything generated is current; test: translator = interpreter on every drawn vector, and every node's own test vectors within their tolerance"
undo = "wire and gen write generated files only: `git checkout -- <file>` puts back the committed one, or run them again. deliver: delete dist/test-apps/."

[[command]]
tool = "group.py"
name = "group"
usage = "python3 tools/group.py check DIR | list DIR | verify DIR | merge DIR [--require-all] | impact DIR NODE"
what = "The structure of a design folder (structure/ and nodes/, as tools/seed_design.py writes it and the group app changes it), checked from Python: every node in exactly one group with its node file saying the same group, stage, label and state; every edge kept by the group of the node that reads, from a node that exists and is not archived; every author, contract and stage owner about the group's own nodes and people; no structure action left unfinished. The same rules as the group app's own check (design/js/structure.js), written a second time. verify checks every group's latest sealed release (tools/release.py) and that it is still the group's; merge takes every latest release into design.tndb with the catalogue of every output (the contract at every group boundary); impact lists who reads a node, across groups."
steps = ["read every group file", "read every node file and compare it with its group", "list every problem", "verify: check every group's latest release with tools/release.py and against the folder", "merge: write every latest release into design.tndb with the catalogue of outputs, keeping the previous one as design.tndb.prev", "impact: follow the edges from a node across groups"]
reads = ["DIR/structure/", "DIR/nodes/", "DIR/releases/"]
writes = ["DIR/design.tndb (merge only)", "DIR/design.tndb.prev (merge only)"]
runs = []
checks = "the structure rules over a design folder; verify: a release against its group; merge: every group's latest release"
undo = "check, list, verify, impact: nothing. merge: delete or restore the design.tndb it wrote (it keeps the previous one as design.tndb.prev)."

[[command]]
tool = "delivery.py"
name = "delivery"
usage = "python3 tools/delivery.py deliver DIR [GROUP ...] [--wave A..E] [--no-test] [--out-of-order REASON] | status DIR [--json] | ship DIR [--out FILE] [--require-accepted]"
what = "Test, deliver, accept, ship (docs/RELEASE_PLAN.md P12, docs/DELIVERY.md): a group's sealed release delivered in its wave's order, with its generated code checked to be the release's, its tests run, its test app and a note; its lead accepts it in the group app; the shipping record says, group by group, who accepted which version, and which group ships visibly UNCONFIRMED and why."
steps = ["deliver: verify the releases (tools/group.py verify) and the wave order", "merge every release into design.tndb", "check the generated code is the release's wiring (tools/groupcode.py)", "run the group's tests (cargo test -p adcs-groups)", "build its test app", "write deliveries/<group>-<version>.delivery.json and .md", "status: released, delivered, accepted, wave by wave", "ship: the shipping record (JSON and Markdown)"]
reads = ["DIR/structure/", "DIR/releases/", "DIR/deliveries/", "design/groups/", "design/groups.toml"]
writes = ["DIR/design.tndb (deliver)", "DIR/deliveries/<group>-<version>.delivery.json, .md, .test-app.html (deliver)", "FILE and FILE.md (ship --out)"]
runs = ["cargo test -p adcs-groups", "cargo build --target wasm32-unknown-unknown -p adcs-groups-wasm"]
checks = "the release passes verify; earlier waves delivered first; the generated code is the release's; the tests pass (recorded); an acceptance is by the lead and names the release's and the delivery's fingerprints"
undo = "deliver: delete the delivery's three files from deliveries/ (and restore design.tndb.prev). status: nothing. ship: delete the files it wrote. An acceptance is a signature in the group file; a later release needs its own."

[[command]]
tool = "evaluate.py"
name = "evaluate"
usage = "python3 tools/evaluate.py DIR [CASE ...] [--out DIR] [--check]"
what = "Every row of the design evaluated for a case, or shown as not computed and why; every KPI closure answered or blocked by name (docs/RELEASE_PLAN.md P13). A row's value is stated by the case (from design.tndb, in SI), computed by its pseudocode in the interpreter from the rows its inputs name, or supplied as evidence by the selected design's Monte Carlo; a closure compares its requirement with its evidence or its analysis row in the requirement's sense."
steps = ["read the design (merged releases, else the node files) and the case from design.tndb", "state the case's values on the rows that declare them, in SI", "run every row's pseudocode once its inputs have values", "take each KPI's evidence from the design loop's Monte Carlo", "answer or block every closure", "write results/EVALUATION.md and evaluation.json"]
reads = ["DIR/design.tndb", "DIR/nodes/", "spec/plan/kpis.toml", "spec/plan/case_inputs.toml", "matlab_sils/store/pipeline/<case>/mc/summary.json"]
writes = ["results/EVALUATION.md", "results/evaluation.json"]
runs = ["node design/js/pcode_cli.mjs run"]
checks = "every row has a value or a reason; every closure an answer or the row that blocks it; --check: no closure that answered before is blocked now, no stated value lost"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one."

[[command]]
tool = "end_to_end.py"
name = "end-to-end"
usage = "python3 tools/end_to_end.py [CASE ...] [--design DIR] [--no-loop] [--no-campaigns] [--jobs N]"
what = "Both cases through everything from the design database (docs/RELEASE_PLAN.md P13, docs/END_TO_END.md): the design loop and the case's campaigns with every engine run reading its inputs from design.tndb alone (TRINETRA_DESIGN), every number held to the one stored before, every row and closure evaluated, the traceability."
steps = ["refuse unless the database holds the data folder's own bytes", "snapshot the case's numbers", "fly the design loop and the case's campaigns from the database", "compare every number, and count the runs naming the database", "evaluate every row and closure; write the traceability", "write results/END_TO_END.md and end_to_end.json"]
reads = ["DIR/design.tndb", "matlab_sils/store/"]
writes = ["matlab_sils/store/pipeline/<case>/", "matlab_sils/store/results_engine/campaigns/", "results/END_TO_END.md", "results/end_to_end.json", "results/EVALUATION.md", "results/TRACEABILITY.md"]
runs = ["tools/pipeline.py", "tools/engine.py campaign", "tools/evaluate.py", "tools/trace.py"]
checks = "the database's inputs are the data folder's (tools/design_inputs.py differences); every run names the database; every number that differs is named"
undo = "It re-flies stored runs: `git checkout -- matlab_sils/store results` puts back the committed ones."

[[command]]
tool = "manual.py"
name = "manual"
usage = "python3 tools/manual.py [--check]"
what = "The apps' manual (design/manual/: a guide per role, the journey of a node, the glossary, the guide to TRI-NETRA Files, and the tours in tours.toml) written as design/js/manual.js, which every app opens in place with Help, and the journey diagram as design/manual/journey.svg. --check says whether both are current and holds the rules: every page starts with its one line (the explanation standard), every tour target is in its app, every field, choice and set of checks in the apps has help beside it."
steps = ["read the manual pages and the tours", "draw the journey", "write design/js/manual.js and design/manual/journey.svg (or, with --check, compare)", "check the rules"]
reads = ["design/manual/", "design/js/*_app.js", "design/js/node_model.js"]
writes = ["design/js/manual.js", "design/manual/journey.svg"]
runs = []
checks = "--check: the manual's pages, tours and field help (see what)"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "node_catalog.py"
name = "node_catalog"
usage = "python3 tools/node_catalog.py [--check]"
what = "The node app's catalogue (design/js/node_catalog.js), written from the spec: the units and the quantities each measures, the physics relations, the sources, the evidence metrics and rungs, the provenance and belief words, the tags and every row of the tree with its label, kind, quantity, unit and layer. The node app offers these as its choices, so they are never typed by hand. --check says whether the committed file is current."
steps = ["read the spec's units, quantities, physics, sources, evidence vocabulary and tree", "write design/js/node_catalog.js (or, with --check, compare)"]
reads = ["spec/"]
writes = ["design/js/node_catalog.js"]
runs = []
checks = "--check: the committed catalogue is current"
undo = "It writes generated files only: `git checkout -- <file>` puts back the committed one, or run it again once its source is as you want it."

[[command]]
tool = "release.py"
name = "release"
usage = "python3 tools/release.py check PATH... | list DIR"
what = "Sealed group releases (releases/<group>-<version>.tnrel, as the group app seals them), checked from Python: each file passes tools/tndb.py check and is named for its group and version; every node's fingerprint, body fingerprint and the release's fingerprint are the SHA-256 of what they cover; its nodes are the group's as sealed, each confirmed or unconfirmed with why; a confirmed node was checked by someone other than its author and, when it computes, has a test vector from outside the code; the lead's seal names the version and the fingerprint. The same rules as design/js/release.js, written a second time."
steps = ["find the release files (under DIR/releases/ for a folder)", "check each one", "list every problem"]
reads = ["DIR/releases/", "PATH"]
writes = []
runs = []
checks = "each release file's fingerprints, its nodes, the confirmed rule and the seal"
undo = "Nothing to undo: it writes nothing."

[[command]]
tool = "drive_pack.py"
name = "drive-pack"
usage = "python3 tools/drive_pack.py [--out DIR] [--rev REV]"
what = "The Drive pack: the two offline apps (TRI-NETRA Files, TRI-NETRA Group) and the design seeded from the spec (20 group files, 734 node files), in the layout the shared Drive folder of the design takes, with a README. CI builds it on every push as the trinetra-drive-pack artifact."
steps = ["build the offline pages", "seed the design", "check every design file", "write the README"]
reads = ["design/", "spec/plan/"]
writes = ["dist/trinetra-drive-pack/"]
runs = []
checks = "the seeded and carried design checks"
undo = "Delete dist/trinetra-drive-pack/."
