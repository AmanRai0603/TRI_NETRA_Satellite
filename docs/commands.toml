[[command]]
tool = "group.py"
name = "group"
usage = "python3 tools/group.py check DIR | list DIR | verify DIR | merge DIR [--require-all] | impact DIR NODE"
what = "The structure of a design folder (structure/ and nodes/, as tools/seed_design.py writes it and the group app changes it), checked from Python: every node in exactly one group with its node file saying the same group, stage, label and state; every edge kept by the group of the node that reads, from a node that exists and is not archived; every author, contract and stage owner about the group's own nodes and people; no structure action left unfinished. The same rules as the group app's own check (design/js/structure.js), written a second time. verify checks every group's latest sealed release (tools/release.py) and that it is still the group's; merge takes every latest release into design.tndb with the catalogue of every output (the contract at every group boundary); impact lists who reads a node, across groups."
steps = ["read every group file", "read every node file and compare it with its group", "list every problem", "verify: check every group's latest release with tools/release.py and against the folder", "merge: write every latest release into design.tndb with the catalogue of outputs, keeping the previous one as design.tndb.prev", "impact: follow the edges from a node across groups"]
reads = ["DIR/structure/", "DIR/nodes/", "DIR/releases/"]
writes = ["DIR/design.tndb (merge only)", "DIR/design.tndb.prev (merge only)"]
runs = []
checks = "the structure rules over a design folder; verify: a release against its group; merge: every group's latest release"
undo = "check, list, verify, impact: nothing. merge: delete or restore the design.tndb it wrote (it keeps the previous one as design.tndb.prev)."

