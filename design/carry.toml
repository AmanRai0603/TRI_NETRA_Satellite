# The carry-over map (docs/RELEASE_PLAN.md P8): what tools/carry_over.py cannot read from a
# registry by itself. Two things, both read from the code that computes them:
#
#   [internal.<layer>]  names for the spec's internal layer-3 rows (l3_<layer>_row_NN, labelled
#                       "to be named"), in row order: each a label, the question it answers and
#                       where it is computed. A layer with fewer names than rows leaves the rest
#                       "to be named", listed as a gap for its owner team.
#   [[add]]             rows a discipline has no node for yet (guidance, onboard navigation, the
#                       satellite's dynamics, FDIR, CMG and VSCMG, each subsystem's sizing), added
#                       to their group: label, question, where it is computed, and the flight
#                       pseudocode function that states it (fsw/pseudocode/), when there is one.
#
# Every entry names code that exists; tools/carry_over.py --check holds each `pcode` to a function
# of fsw/pseudocode/ and each file in `code` to a file of the repository. Nothing here is a number:
# values, test vectors and explanations come from their registries, or stay gaps.
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.

# ------------------------------------------------------------------ internal rows, by layer

