context = "Safe mode is a coils-only detumble after 60 s of sensor silence; it can deadlock (G5) and runs on the same OBC and magnetometer as nominal (H5). There is a single magnetometer, a single-point failure, and mag_fail is excluded from the fault campaigns (Y11)."
