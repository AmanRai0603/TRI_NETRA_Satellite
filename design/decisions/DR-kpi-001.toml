schema = "trinetra-decision/1"
id = "DR-kpi-001"
decisions = ["DD8"]
title = "Statistical interpretation and confidence of a verdict"
group = "kpi"
parent = "p1k"
owner_team = "kpi"
status = "proposed"
owner_question = 1
items = ["A1", "A6", "A7"]
context = "A closure 'passes' today when the sorted value at ceil(level*n) of the finite runs is within the limit (tools/evaluate.py:231-270): no confidence is stated, a run that gives NaN is dropped, and 12 runs can 'pass' a 99.73 % requirement. Without a stated interpretation and confidence no verdict means anything."
drivers = ["req.ape", "req.ake", "every closure_verified row of the KPI group"]
standard = ["ECSS-E-ST-60-10C section 4.2.3 (statistical interpretation), section 5.2", "Clopper and Pearson (1934), Biometrika 26:404"]
current = "level 99.73 only; the percentile of the finite runs compared with the limit; no confidence; NaN runs dropped; a percentile of fewer than 371 samples is the largest (S7.14b)"
choice = "mixed interpretation: each run's metric is the temporal statistic the KPI states over its window; the requirement's level is the ensemble probability that a run meets it; confidence 95 % one-sided (Clopper-Pearson); a run with no finite value is a failure; the verdict is 'pass' when the lower bound reaches the level, 'fail' when the upper bound is below it, else 'not demonstrated (R >= x at 95 %)'; a selection marked infeasible never passes"
rationale = "Clopper-Pearson is exact for a binomial count and conservative, so a 'pass' can be read without the statistician; 95 % is the roadmap's and ECSS's usual confidence. Zero failures demonstrate 99.73 % at 95 % from n >= ln(0.05)/ln(0.9973) = 1109 runs, which is why the claims campaigns fly 1109 and the 15-24-run campaigns say 'not demonstrated'."
consequences = "Every verdict of a small campaign reads 'not demonstrated' until a 1109-run campaign flies it; ais_3u APE and AKE no longer show 'pass' (results/EVALUATION.md). One verdict function serves tools/evaluate.py and tools/trace.py."
method = """n runs, k of them successes (finite and within the limit), level p, confidence g = 0.95.
Lower bound R_L = BetaInv(1 - g; k, n - k + 1) (0 when k = 0); upper bound R_U = BetaInv(g; k + 1, n - k) (1 when k = n).
R_L >= p: pass. R_U < p: fail. Otherwise: not demonstrated (R >= R_L at 95 %).
Example: 12 runs, all within the limit, p = 0.9973: R_L = 0.05^(1/12) = 0.779: 'not demonstrated (R >= 0.78 at 95 %)'."""
sets = ["a stated node kpi_verdict_confidence (0.95), added with A1 in S11.10", "the one verdict function of tools/evaluate.py and tools/trace.py (S11.10)"]
revisit_when = "a requirement states its own confidence or interpretation (per requirement, the third option)"
signature = {}

[[option]]
name = "95 % one-sided Clopper-Pearson, NaN a failure (the roadmap's A1)"
evidence = "docs/TECHNICAL_ROADMAP.md A1; docs/S11_INVENTORY.md A1"
rejected_because = ""

[[option]]
name = "90 % one-sided"
evidence = "fewer runs for a claim (ln(0.1)/ln(0.9973) = 852)"
rejected_because = "weaker than the confidence ECSS practice and the roadmap name; the owner may still take it"

[[option]]
name = "a confidence and interpretation per requirement"
evidence = "ECSS-E-ST-60-10C section 4.2.3 lets each index state its own"
rejected_because = "no requirement states one today; it is the revisit, not the default"
