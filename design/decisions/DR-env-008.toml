context = "The relative velocity is co-rotation only (adcs-sim/src/run.rs:64,70; S7.6/orbitfast.pc:34); POP's wind hook is zero in the loop (adcs-pop/src/drag.rs:32-35). The roadmap cites HWM14 at the order of 100-200 m/s."
current = "no wind"
choice = "A wind of stated magnitude by latitude and Kp, truth only, dispersed per draw, its magnitudes the developer's and unsigned, of the order of the roadmap's cited 100-200 m/s (HWM14). HWM14's coefficient file is not in the repository. S12.1 (the developer's proposal, unsigned)."
rationale = "A stated wind exercises the effect on drag torque and the orbit without a file we do not hold."
consequences = "Drag torque and the orbit carry a wind error; campaigns draw it."
sets = ["a wind node in env (to be stated in S12.10 as env_wind_model), read by env_drag_force rel_velocity"]
revisit_when = "the HWM14 file is added"
