schema = "trinetra-decision/1"
id = "DR-fdir-002"
decisions = ["DD40"]
title = "FDIR hierarchy: gyro staleness, the star-tracker coast, the watchdog"
group = "fdir"
parent = "gq"
owner_team = "fdir"
status = "proposed"
items = ["F2/G3", "G4"]
context = "A silent gyro keeps feeding its last rate to the MEKF, the controllers and the detumble exit for 60 s (fsw/pseudocode/08_mode_manager.pc:198), and the 900 s tracker coast (fsw_param_st_coast_s) then lets the attitude diverge with no fault (143 deg in 50 s)."
drivers = ["F2/G3", "the detumble hold", "fsw_param_st_coast_s (900 s)"]
standard = ["ECSS-E-ST-60-30C", "SAVOIR FDIR handbook (levels 0-4)"]
current = "a stale gyro is a fault only after 60 s; the tracker coast of 900 s runs on the stale rate; no rate damping while the attitude is invalid"
choice = "a gyro sample unchanged for 3 ticks is quiet (fault bit 10): its rate is dropped; while the attitude is valid the controllers take the rate of the filter's attitude (att_rate) instead, and the MEKF propagates with inflated process noise; the tracker coast ends; the 60 s fault stays as the level above it (detumble). With the attitude invalid the pointing modes damp the rate beyond 2e-3 rad/s (damp_excess), not to zero. The stale limit is shorter than the detumble hold, as the roadmap requires."
rationale = "Three ticks (0.3 s at 10 Hz) is the shortest limit a healthy gyro never trips on a frozen-count check and is far below the detumble hold. A bare zero rate left the rotor loops undamped (fault_gyro_silent diverged within 30 s), so the filter's attitude rate stands in. Damping to zero inertially stopped the nadir hold and doubled safe_mode_ais's last-orbit error, so only the rate beyond 2e-3 rad/s (also the MEKF's inflated rate bound) is damped. The numbers are the developer's, recorded here so the owner signs them (S11.5)."
consequences = "fault_gyro_silent: knowledge error 179.98 -> 0.020 deg until the 60 s fault takes it to detumble; fault_st_blind: body rate after the blind eclipse 229 -> 0.096 deg/s; healthy-gyro scenarios unchanged by the staleness; the G4 damping moves small numbers in nine scenarios (fine-state starts after detumble, safe-mode recovery), no verdict."
sets = ["fsw_modes fdir_hold (the stale count), a stated node fsw_param_gyro_stale_ticks (3), added with F2 in S11.5", "fsw_estimation (the inflated process noise)"]
revisit_when = "the FMECA (S14) sets the levels"
signature = {}

[[option]]
name = "stale after 3 ticks; rate zeroed, Q inflated, coast ended; 60 s fault above it"
evidence = "docs/TECHNICAL_ROADMAP.md F2/G3"
rejected_because = ""

[[option]]
name = "innovation-based isolation"
evidence = "docs/DESIGN_DECISIONS.md DD40"
