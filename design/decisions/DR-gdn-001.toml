context = "Nadir is the geocentric -r direction with no yaw steering (docs/NAV_GUIDANCE_AUDIT.md). Geodetic nadir differs by up to 0.17 deg (E7), larger than APE 0.01 deg, so any APE claim depends on which nadir the payload means."
