items = ["Y8", "Y15"]
context = "The modes are detumble, Sun acquisition, Sun referencing, nadir, target and slew, with 11 flight-software states; there is no separation or LEOP mode, and the tip-off rate 10 deg/s is UNCONFIRMED. The detumble exit is 0.5 deg/s held 60 s while the catalogue's detumble mode says 10 min and the metric uses 600 s (DD37)."
drivers = ["the launch provider's tip-off figure", "first-acquisition energy"]
standard = ["ECSS-E-ST-60-30C section 4", "CubeSat Design Specification (inhibit timers)"]
current = "six modes, 11 states, no LEOP mode; tip-off 10 deg/s UNCONFIRMED"
choice = "S12.1 (the developer's, unsigned): the tip-off range is refused until the launch provider states it; the developer's proposal is 0-30 deg/s per axis, sized at 30, written here for the owner to confirm and never flown as a requirement (a blank mission.w0 is refused, not set to 10; the case states lo and hi). The mode set stays the owner's: the present six modes fly."
rationale = "A mode set and a tip-off range are the owner's with the launch provider; the developer records the present set and the conflicts (detumble exit 60 s vs 600 s) for that decision."
consequences = "Scenarios keep the 10 deg/s tip-off, read as unconfirmed. S12.1 (the developer's, unsigned): the sizing and the detumble campaign read the stated range once the launch provider gives it; until then the closure reads 'not stated' and the run reports the metric against the 0-30 deg/s proposal as information (to be stated in S12.12)."
sets = ["fsw_modes", "the catalogue's modes", "m1_5 and l3_budget_row_01 h_detumble: the tip-off range (to be stated in S12.12 as mission_tipoff_range)"]
revisit_when = "the launch provider names the tip-off range"
signature = {}

