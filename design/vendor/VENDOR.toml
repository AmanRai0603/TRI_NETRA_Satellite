# Third-party files the offline pages carry inside them (tools/pages.py inlines them; no page loads
# anything from an outside host). Each is pinned by its SHA-256: `tools/pages.py check` refuses a
# file that differs. To update one: fetch the release named here, put the files in place, record
# the new version and hashes, and run the browser tests (tests/browser/files.test.mjs).
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.

[sqljs]
what = "SQLite compiled to WebAssembly (sql.js): the design files in the browser"
version = "1.14.2"
source = "npm sql.js@1.14.2, dist/"
licence = "MIT (sqljs/LICENSE); SQLite itself is public domain"
files = { "sqljs/sql-wasm.js" = "f1c84000dbc856c9d87f4f3aabc4d3654bd436165db4be3da13751db3a9c20d7", "sqljs/sql-wasm.wasm" = "38c14f6e379210bc942bdc4ebca44e7bfdb4318ecc1c72ca666a28fdce96670a" }

