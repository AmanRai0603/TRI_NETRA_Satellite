# Imaging 3U: fine nadir hold with wheels + star tracker + MEKF from a 2 deg error; the gyro answers with its last sample from 1200 s
# A scenario of the tick faults' rig (S11.4, docs/S11_INVENTORY.md TS4): it shows today's defect of the flight software's tick,
# judged against the behaviour its fix owes (F3: an integer tick counter for the rate groups; F2: no rate from a silent gyro).
# S11.5 set the bound from DR-fdir-002: the gyro is quiet after 3 ticks and its rate dropped, the loops take the attitude's change as theirs, and 60 s
# later the fault above it (60 s) holds the spacecraft in detumble: no attitude is held after that, so the error is judged over the time it points.
schema = "adcs-scenario/1"
id = "fault_gyro_silent"
label = "3U imaging - the gyro freezes on its last sample, flagged ok, during fine hold"
case = "ais_img_3u"
product = "TRN-P-3U-IMG"
[time]
duration_s = 5740.0
dt_s = 0.1
record_dt_s = 0.1
[initial]
attitude = { kind = "error_from_target", angle_deg = 2.0, axis_body = [0.577, 0.577, 0.577] }
rate = { kind = "lvlh" }
[fsw]
start_mode = "nadir_fine"
guidance = { kind = "nadir" }
rw_bandwidth = 0.9
rw_damping = 2.0
rw_rate_hz = 10.0
[[metrics]]
id = "ake_3ax_max"
kind = "ake"
window = "pointing"
statistic = "max"
limit = 1.0
[[metrics]]
id = "ake_los_max"
kind = "ake_los"
window = "pointing"
statistic = "max"
diagnostic = "the knowledge error across the line of sight, beside the judged three-axis bound (a clean run holds 0.004 deg)"
[[metrics]]
id = "ape_los_max"
kind = "ape_los"
window = "pointing"
statistic = "max"
diagnostic = "the performance error across the line of sight (a clean run holds 0.008 deg)"

[[faults]]
kind = "gyro_fail"
t_s = 1200.0
