# The design files (docs/RELEASE_PLAN.md P1): what each SQLite file holds, table by table. The
# one source of their shape: tools/tndb.py makes, opens, checks and upgrades them from here, the
# Rust reader (engine/crates/trinetra-design) and the browser's reader (design/js/tndb_schema.js)
# are generated from or checked against it.
#
#   <id>.node.tndb        one node: what its author writes and signs        (node app)
#   <group>.group.tndb    one group: its structure, people, contracts       (group app)
#   <group>-<v>.tnrel     one sealed release of a group: frozen, never edited (group app)
#   design.tndb           every group's released content merged             (developer side)
#   <id>.tnissue          an issue raised from a red mark                   (2.0.0)
#   <rel>.<group>.tnanswer an answer to a release that moves a group's values (2.0.0)
#   <name>.tncase         a case, or a variation of one                     (2.0.0)
#   <design>.<target>.tnfsw a flight image built from a design              (2.0.0)
#   <person>.tnkey        a person's key, on their own computer only        (2.0.0)
#
# Results stay in the existing result package (`.trinetra`, schema adcs-result/1) and the results
# index (`.adcs-index.sqlite`, adcs-index/2); the design files point at them by result id.
#
# Every file starts with the `meta` table: its format, its format version, the program that wrote
# it. A program opens a file of its own version, upgrades an older one (keeping a copy of the
# original beside it), and refuses a newer one by name. A format's version rises with any change
# to its tables; each rise has its upgrade step in tools/tndb.py (UPGRADES).
#
# Column types are SQLite's: text, integer, real, blob. `key` marks the primary key.
#
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.
schema = "trinetra-design-schema/1"

# ------------------------------------------------------------------ shared tables
[tables.meta]
about = "what the file is: one row per key (format, format_version, id, written_by, created)"
columns = [["key", "text key"], ["value", "text"]]

[tables.revision]
about = "every save: who, when, what changed"
columns = [["n", "integer key"], ["at", "text"], ["by", "text"], ["summary", "text"]]

[tables.comment]
about = "comments, threaded by parent"
columns = [["id", "text key"], ["at", "text"], ["by", "text"], ["about", "text"], ["parent", "text"], ["body", "text"], ["resolved", "integer"]]

[tables.change_request]
about = "a request to change something this file does not own (a contract, a structure)"
columns = [["id", "text key"], ["at", "text"], ["by", "text"], ["about", "text"], ["body", "text"], ["state", "text"]]

[tables.signature]
about = "a typed name standing behind the content (no accounts: stated plainly, Drive's history backs it)"
columns = [["role", "text"], ["name", "text"], ["at", "text"], ["statement", "text"]]

# ------------------------------------------------------------------ the node file
[tables.node]
about = "the node: one row"
columns = [["id", "text key"], ["sheet", "text"], ["group_id", "text"], ["stage", "text"], ["layer", "text"],
           ["kind", "text"], ["label", "text"], ["state", "text"], ["author", "text"], ["contract_version", "integer"]]

[tables.content]
about = "what the author writes, section by section and field by field, each with where it came from"
columns = [["section", "text"], ["field", "text"], ["value", "text"], ["origin", "text"]]

[tables.input]
about = "what the node reads: a name, the node and output it comes from, its unit"
columns = [["name", "text key"], ["from_node", "text"], ["from_output", "text"], ["unit", "text"]]

[tables.output]
about = "what the node answers: a name, its unit and range (its contract to other nodes)"
columns = [["name", "text key"], ["unit", "text"], ["lower", "real"], ["upper", "real"], ["reason_lower", "text"], ["reason_upper", "text"]]

[tables.fixture]
about = "an expected value from outside the code: the inputs, the answer, the tolerance, the source"
columns = [["name", "text key"], ["inputs", "text"], ["expected", "text"], ["tolerance", "real"], ["source", "text"], ["outside", "integer"]]

[tables.attachment]
about = "a picture or document: kept as bytes, shown as an image (never run) or downloaded"
columns = [["name", "text key"], ["mime", "text"], ["size", "integer"], ["bytes", "blob"]]

# ------------------------------------------------------------------ the group file
[tables.group_info]
about = "the group: one row"
columns = [["id", "text key"], ["label", "text"], ["lead_team", "text"], ["lead", "text"]]

[tables.stage]
about = "the group's stages and who signs each"
columns = [["id", "text key"], ["label", "text"], ["owner", "text"]]

[tables.member]
about = "the people of the group and their role (author, stage owner, lead)"
columns = [["name", "text key"], ["role", "text"]]

[tables.member_node]
about = "who authors which node"
columns = [["node", "text key"], ["author", "text"], ["issued_at", "text"]]

[tables.group_node]
about = "the nodes of the group, their stage and state"
columns = [["id", "text key"], ["sheet", "text"], ["stage", "text"], ["layer", "text"], ["kind", "text"], ["label", "text"], ["state", "text"]]

[tables.edge]
about = "a node reading another (kind: derivation, or contribution to a KPI), within the group or across"
columns = [["from_node", "text"], ["to_node", "text"], ["kind", "text"], ["label", "text"]]

[tables.contract]
about = "an output other groups read: its unit, its version, who reads it"
columns = [["node", "text"], ["output", "text"], ["unit", "text"], ["version", "integer"], ["readers", "text"]]

# ------------------------------------------------------------------ the release file
[tables.release]
about = "the sealed release: one row; the fingerprint covers every node's content"
columns = [["group_id", "text"], ["version", "text"], ["sealed_at", "text"], ["sealed_by", "text"], ["fingerprint", "text"]]

[tables.release_node]
about = "each node as sealed: its content as JSON, and its own fingerprint"
columns = [["id", "text key"], ["fingerprint", "text"], ["content", "text"]]

# ------------------------------------------------------------------ the design database
[tables.design_group]
about = "each group merged in, at which release"
columns = [["id", "text key"], ["version", "text"], ["fingerprint", "text"], ["merged_at", "text"]]

[tables.design_node]
about = "every node of every group, as released"
columns = [["id", "text key"], ["group_id", "text"], ["stage", "text"], ["layer", "text"], ["kind", "text"],
           ["label", "text"], ["content", "text"], ["release", "text"]]

[tables.design_case]
about = "every case the engine flies, row by row as the case states it (cases/<id>.csv): its line as written, its fields, and the node that declares the value (spec/plan/case_inputs.toml)"
columns = [["case_id", "text key"], ["ord", "integer key"], ["section", "text"], ["key", "text"], ["label", "text"], ["unit", "text"],
           ["value", "text"], ["lo", "text"], ["hi", "text"], ["level", "text"], ["note", "text"], ["node", "text"], ["line", "text"]]

[tables.engine_input]
about = "every other input the engine reads, by its path in the data folder (data/scenarios, products, parts, algorithms, the catalogue): its bytes and their fingerprint (FNV-1a 64, as a run records it)"
columns = [["path", "text key"], ["fingerprint", "text"], ["body", "blob"]]

[tables.catalogue_output]
about = "the catalogue of outputs: the contract at every group boundary"
columns = [["node", "text"], ["output", "text"], ["unit", "text"], ["version", "integer"], ["readers", "text"]]

# ------------------------------------------------------------------ 2.0.0 (format 2): the block model
# Added beside the 1.0.0 tables, never changing them, so a format-1 file upgrades by gaining empty
# tables and nothing it holds moves (docs/PLAN_2_0.md S2; docs/SYSTEM_MODEL.md §2-§6).
[tables.block]
about = "the node as a block of the tree: its parent (any depth), its perspective, its behaviour, its owner, and the estimate it keeps when broken down"
columns = [["id", "text key"], ["parent", "text"], ["perspective", "text"], ["behaviour", "text"], ["owner", "text"], ["estimate", "text"]]

[tables.port]
about = "each input and output's 2.0.0 facts, beside input/output (which keep its unit, range and source): its type, state, maturity, the way a requirement binds, its owner and due gate while open, its bundle"
columns = [["name", "text key"], ["direction", "text key"], ["type", "text"], ["state", "text"], ["maturity", "text"], ["sense", "text"],
           ["owner", "text"], ["due_gate", "text"], ["bundle", "text"]]

[tables.loop]
about = "a loop declared on the block that holds it: what must settle, how tightly, in how many iterations at most"
columns = [["id", "text key"], ["settles", "text"], ["tolerance", "real"], ["max_iterations", "integer"], ["note", "text"]]

[tables.closure]
about = "a requirement against its achieved value: the two ports, the way it binds, by analysis or by evidence (with the metric and campaign)"
columns = [["id", "text key"], ["requirement", "text"], ["achieved", "text"], ["sense", "text"], ["by", "text"], ["metric", "text"], ["campaign", "text"]]

[tables.key_signature]
about = "a signature made with a person's key: who, as what role, which revision and content it covers, the key's fingerprint and the Ed25519 signature (base64)"
columns = [["n", "integer key"], ["role", "text"], ["signer", "text"], ["key_fingerprint", "text"], ["revision", "integer"],
           ["content_hash", "text"], ["at", "text"], ["statement", "text"], ["signature", "text"]]

[tables.group_frame]
about = "the group in the tree: the group it mounts under, the design it is based on, its subsystem engineer and deputy, whether its nodes need a checker"
columns = [["id", "text key"], ["parent_group", "text"], ["base", "text"], ["subsystem_engineer", "text"], ["deputy", "text"], ["checker_required", "integer"]]

[tables.mount]
about = "each block of the branch above that the group mounts on: the contract between the two groups"
columns = [["on_block", "text key"], ["via", "text"], ["contract_version", "integer"]]

[tables.member_key]
about = "a person's public key, as registered by the owner of this file: their role, its fingerprint, whom they deputise for, who registered it and when"
columns = [["name", "text key"], ["role", "text"], ["public_key", "text"], ["fingerprint", "text"], ["deputy_of", "text"],
           ["registered_at", "text"], ["registered_by", "text"]]

[tables.issue]
about = "an issue raised from a red mark: where, the evidence, whom it is addressed to, and the release that closes it"
columns = [["id", "text key"], ["group_id", "text"], ["node", "text"], ["at", "text"], ["by", "text"], ["title", "text"], ["body", "text"],
           ["evidence", "text"], ["addressed_to", "text"], ["state", "text"], ["closed_by", "text"]]

[tables.answer]
about = "a subsystem engineer's answer to a release that moves their values: fine, or object, because"
columns = [["release", "text key"], ["answering_group", "text"], ["verdict", "text"], ["because", "text"], ["at", "text"], ["by", "text"]]

[tables.case_info]
about = "a case: what it is, the case it is a variation of (empty for a base case), its scenario and campaign"
columns = [["id", "text key"], ["base", "text"], ["label", "text"], ["scenario", "text"], ["campaign", "text"], ["note", "text"]]

[tables.case_line]
about = "a case's lines in order, as the case CSV states them (adcs-case/1), with the node each declares; a variation holds only the lines it changes"
columns = [["ord", "integer key"], ["section", "text"], ["key", "text"], ["label", "text"], ["unit", "text"], ["value", "text"], ["lo", "text"],
           ["hi", "text"], ["level", "text"], ["note", "text"], ["node", "text"], ["line", "text"]]

[tables.case_source]
about = "a case's source as it was written (the CSV, or a scenario's, campaign's or trade's TOML), kept whole"
columns = [["name", "text key"], ["format", "text"], ["text", "text"]]

[tables.flight_image]
about = "the flight software built from a design for one target: the design it came from, the runtime and toolchain, the image's hash"
columns = [["target", "text key"], ["design_version", "text"], ["design_fingerprint", "text"], ["runtime_version", "text"], ["toolchain", "text"],
           ["built_at", "text"], ["built_by", "text"], ["image_sha256", "text"]]

[tables.flight_file]
about = "each file of a flight image (the generated sources, the binary, the configuration blob) and its hash"
columns = [["path", "text key"], ["sha256", "text"], ["bytes", "blob"]]

[tables.flight_check]
about = "each check the flight build made on the image: a node's vectors, a parity, a timing"
columns = [["name", "text key"], ["passed", "integer"], ["note", "text"]]

[tables.private_key]
about = "a person's key, kept on their own computer: the private half sealed by their passphrase (PBKDF2-SHA256, AES-256-GCM)"
columns = [["name", "text key"], ["public_key", "text"], ["fingerprint", "text"], ["kdf_iterations", "integer"], ["salt", "text"], ["nonce", "text"],
           ["sealed_private", "text"], ["created", "text"]]

[tables.design_release]
about = "which design this is: today's, a daily snapshot, a preview or a released design; its version; what it needs to run"
columns = [["version", "text key"], ["kind", "text"], ["built_at", "text"], ["built_by", "text"], ["needs_application", "text"], ["toolbox", "text"]]

[tables.integration_record]
about = "what integration checked, release by release, and what it found"
columns = [["n", "integer key"], ["at", "text"], ["by", "text"], ["release", "text"], ["check", "text"], ["result", "text"], ["note", "text"]]

# ------------------------------------------------------------------ the behaviours
# What a block's behaviour (the block table's `behaviour`) may be (docs/SYSTEM_MODEL.md §2). A value, not a table:
# adding one raises no format's version (a format's version rises with a change to its tables, as S2 set). Every
# program that checks a file holds each block's behaviour, in a node file, a release and a design, to this list.
[behaviours]
method = "its pseudocode, run on its inputs"
children = "whatever its children give at its outputs"
stated = "a value or a description a person states, with its source"
lookup = "a table and how to read it"
open = "not decided yet: a draft, refused by name if a run reaches it"
evidence = "what a run, a campaign or a rig measures: the metric or source it names, by result id; open until one gives it"
closure = "a requirement against its achieved value (its closure row), compared by the library in the requirement's sense"
built-in = "temporary: a relation still in compiled code, found by its node id; none remains at 2.0.0 (docs/PLAN_2_0.md S7)"

# ------------------------------------------------------------------ the formats
[formats.node]
extension = ".node.tndb"
version = 2                     # 2: the block model (block, port, loop, closure, key_signature), S2
tables = ["meta", "node", "content", "input", "output", "fixture", "attachment", "revision", "comment", "change_request", "signature",
          "block", "port", "loop", "closure", "key_signature"]
max_bytes = 52428800            # 50 MB a node file
max_attachment_bytes = 512000   # 500 KB a picture

[formats.group]
extension = ".group.tndb"
version = 2                     # 2: the group in the tree (group_frame, mount), keys (member_key, key_signature), S2
tables = ["meta", "group_info", "stage", "member", "member_node", "group_node", "edge", "contract", "revision", "comment", "change_request", "signature",
          "group_frame", "mount", "member_key", "key_signature"]

[formats.release]
extension = ".tnrel"
version = 2                     # 2: the group in the tree, and the seal signed with a key, S2
tables = ["meta", "release", "release_node", "group_info", "stage", "group_node", "edge", "contract", "signature",
          "group_frame", "mount", "key_signature"]

[formats.design]
extension = ".tndb"
version = 3                     # 2: the engine's inputs (design_case, engine_input), P11; 3: which design it is, the integration record, keys, S2
tables = ["meta", "design_group", "design_node", "edge", "catalogue_output", "design_case", "engine_input",
          "design_release", "integration_record", "key_signature"]

[formats.issue]
extension = ".tnissue"
version = 1
tables = ["meta", "issue", "comment", "key_signature"]

[formats.answer]
extension = ".tnanswer"
version = 1
tables = ["meta", "answer", "key_signature"]

[formats.case]
extension = ".tncase"
version = 1
tables = ["meta", "case_info", "case_line", "case_source", "revision", "comment", "key_signature"]

[formats.flight_image]
extension = ".tnfsw"
version = 1
tables = ["meta", "flight_image", "flight_file", "flight_check", "key_signature"]

[formats.key]
extension = ".tnkey"
version = 1
tables = ["meta", "private_key"]
