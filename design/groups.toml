# The groups of the ADCS design (docs/RELEASE_PLAN.md §4): who owns which rows, in which stages,
# in which code modules, and where groups meet. One group is one discipline, owned by one team
# and released by one lead (owner, 3 Oct 2026). tools/groups.py checks this file against every
# row of the tree (tools/design_rows.py): each row in exactly one group, each group's count as
# stated here, each stage inside its group.
#
# How a row is placed:
#   1. an [[override]] that names it;
#   2. a layer-3 required or achieved row goes with the target it answers (so a subsystem layer
#      split between two groups, as `modes` is, splits by target);
#   3. otherwise the group whose `branches` holds the row's branch (its layer-1/2 group, or its
#      subsystem layer).
#
# `wave`: when the group goes through test, delivery and acceptance (docs/RELEASE_PLAN.md P12):
# A inputs, B hardware, C GNC, D system, E verification and business, in dependency order, each
# wave's outputs in the catalogue before the next (tools/group.py deliver, status, ship).
# Rows a discipline has no node for yet (guidance, CMG, VSCMG, dynamics, onboard navigation, each
# subsystem's sizing) are added when content is carried over (P8); their stages are here already.
#
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.
schema = "trinetra-groups/1"

