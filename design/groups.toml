# The spec's "Modes and FDIR" (gq) splits by what each row is about: mode timing goes with
# guidance and mode management, fault handling with FDIR. The layer-3 required and achieved rows
# follow their target (rule 2); the layer's interface and its internal rows stay with `gdn`
# until their content is carried over (P8) and each is placed by what it computes.
[[override]]
ids = ["gq_0", "gq_1", "gq_4"]
group = "gdn"
reason = "detumble time, safe-mode Sun acquisition and momentum dump interval are mode timing"

[[override]]
ids = ["gq_2", "gq_3"]
group = "fdir"
reason = "faults tolerated and fault recovery time are fault handling"

# Where groups meet (docs/RELEASE_PLAN.md §4, rule 3): who owns a row that could be claimed twice.
[[boundary]]
between = ["dyn", "act"]
rule = "the actuator's own physics (torque, momentum, power, faults) is act's; how its momentum enters the body's equations is dyn's"

[[boundary]]
between = ["*", "design"]
rule = "a row that models how a device behaves stays in its subsystem's group; a row that sizes it (how big, how heavy, which part) is design's"

[[boundary]]
between = ["nav", "gdn", "ctl", "fdir", "fsw"]
rule = "the algorithm is its group's; when and how it is called (scheduling, timing, the HAL, the parameter tables) is fsw's"

[[boundary]]
between = ["kpi", "vv"]
rule = "what is required and what was achieved is kpi's; how it was proven (campaigns, coverage, standards) is vv's"
