about = "the relations the boundary check still declared in code moved into the design (docs/S7_INVENTORY.md S7.19b): the precision orbit's Earth-orientation parameters, the splice of the IERS series and their interpolation, as a method of env; the flight software's onboard orbit (the GNSS fix's gate, frame and age, the propagation between fixes), which S6 left in the runtime's tick, as nav's; each the developer's transcription of the code and of the publication it cites"

[[revision.node]]
id = "env_eop"
group = "env"
parent = "m3"
label = "Earth-orientation parameters: the IERS series spliced and interpolated"
behaviour = "method"
question = "What UT1 - UTC, polar motion and celestial pole offsets does the precision orbit's IAU 2006/2000A frame take at an epoch, from the IERS's C04 and finals2000A series?"
why = "the EOP splice and interpolation of the precision orbit's frame builds A, B and C, until now adcs-pop eop.rs (S7.3 moved every other frame model; the file readers stay code)"

[[revision.method]]
node = "env_eop"
pseudocode = "design/revisions/S7.19b/eop.pc"
path = "env/eop.pc"
transcribes = "engine/crates/adcs-pop/src/eop.rs (leap_at, interp1_linear, lagr, splice, finalize_eop, interp_linear, interp_c), the port of the EOP half of the Octave POP's frames.eci2ecef_A, _B and _C (leap_at, splice, finalize_eop, eop_interp, lagr)"
source = "IERS Conventions (2010) section 5.5.1 (Petit and Luzum, IERS TN 36) and the IERS's interp.f (LAGINT, 4-point Lagrange; RG_ZONT2); IERS EOP 20 C04 and finals2000A (IERS Rapid Service/Prediction Centre) as the files define their columns; GNU Octave's interp1 ('linear', extrapolated)"
generate = ["adcs-pop"]
uses = ["env/tidaleop.pc", "env/iau2006.pc"]
why = "the EOP splice and interpolation as a method of env, generated into adcs-pop; the readers of the leap-second, finals2000A and C04 files stay code and hand their columns to it"

