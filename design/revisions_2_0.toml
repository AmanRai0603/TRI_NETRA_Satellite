about = "the actuators as methods of act (docs/S7_INVENTORY.md S7.7): the magnetorquer coils (lag, saturation, power, allocation, dispersion, a failed coil, the coil torque m x B), the reaction wheels (motor line, speed and momentum limits, bearing friction, its compensation, torque noise, misalignment, power), the fluid rings (pump efficiency and power, flow filter and noise, field, flow limits and constants, misalignment), the CMG and VSCMG rotors and gimbals, the momentum devices as the engine flies them (a new node), and the thrusters (torque directions, thrust and impulse dispersion, minimum impulse bit, propellant and the empty tank, valve power, misalignment, a failed couple), each the developer's transcription of the code and of the publication it cites, their random draws the language's streams (rng.rs's); the values the engine used with no node (the product's device defaults, the rotors' telemetry noises) stated by their owner, act, as the 1.0.0 code gave them"

[[revision.node]]
id = "act_rotor_set"
group = "act"
parent = "sb2"
label = "Momentum devices as the engine flies them"
behaviour = "method"
question = "How do the wheels, rings, CMGs and VSCMGs and their gimbals answer their commands each step (their momentum rates and power), a failed rotor coasting?"
why = "the momentum devices' assembly of their rows' relations, until now adcs-sim-core actuators.rs (Mex), which had no node: the failed rotor's coast and the order of the draws are its own"

