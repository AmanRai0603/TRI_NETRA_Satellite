# The developer's revisions of the converted design (docs/PLAN_2_0.md, "The re-plan of 6 October": until the
# ownership stage the developer changes the design, in the database and in the code together, and marks each
# change as the developer's, not yet signed by a person).
#
# tools/convert_2_0.py applies them, in order, on top of the conversion of 1.0.0 (a corrected conversion, zip 1.x),
# so the regression copy is still made by the two commands of tests/regression/README.md, byte for byte. Each
# change names the nodes it moves (by id, or by a kind or a content field they all have), the behaviour they had
# (`from`: a node with any other is refused by name) and the behaviour they get (`to`), and why. A changed node:
#   - keeps every row 1.0.0 gave it (a `code.*` pointer stays as provenance: it no longer makes the node built-in);
#   - gains the rows the change adds (`content`: section, field, value), with the revision as their origin;
#   - gains a row in its history (the node file's revision table): who, when, what changed and why;
#   - is sealed unconfirmed with the revision's reason after the conversion's (its release's `why`).
#
# Nothing here is a number or a table: a behaviour, a pointer to where a value comes from, and a reason. Published data
# comes in only through a reader (`[[revision.data]]`: tools/readers.py, code, reads the file the revision names, and
# every table cites its publication and the file with its sha256); a relation only as the developer's transcription
# (`[[revision.method]]`: a pseudocode file under design/revisions/, the revision's source, naming the code and the
# publication it transcribes). A revision may also add a node (`[[revision.node]]`) to hold either.
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.

schema = "trinetra-revisions/1"

