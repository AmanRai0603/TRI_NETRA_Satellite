<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Inter, Arial, sans-serif" role="img" aria-label="The journey of a node">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="500.0" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">From an author to a release</text>
<rect x="21" y="46" width="118" height="92" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.2"/>
<text x="80" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">1 Write</text>
<text x="80" y="100" text-anchor="middle" font-size="12" fill="#334155">author</text>
<text x="80" y="120" text-anchor="middle" font-size="12" fill="#64748b">node app</text>
<rect x="161" y="46" width="118" height="92" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.2"/>
<text x="220" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">2 Check</text>
<text x="220" y="100" text-anchor="middle" font-size="12" fill="#334155">second engineer</text>
<text x="220" y="120" text-anchor="middle" font-size="12" fill="#64748b">node app</text>
<line x1="141" y1="92.0" x2="159" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="301" y="46" width="118" height="92" rx="10" fill="#ede9fe" stroke="#334155" stroke-width="1.2"/>
<text x="360" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">3 Sign stage</text>
<text x="360" y="100" text-anchor="middle" font-size="12" fill="#334155">stage owner</text>
<text x="360" y="120" text-anchor="middle" font-size="12" fill="#64748b">group app</text>
<line x1="281" y1="92.0" x2="299" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="441" y="46" width="118" height="92" rx="10" fill="#ede9fe" stroke="#334155" stroke-width="1.2"/>
<text x="500" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">4 Seal</text>
<text x="500" y="100" text-anchor="middle" font-size="12" fill="#334155">group lead</text>
<text x="500" y="120" text-anchor="middle" font-size="12" fill="#64748b">group app</text>
<line x1="421" y1="92.0" x2="439" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="581" y="46" width="118" height="92" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="640" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">5 Build</text>
<text x="640" y="100" text-anchor="middle" font-size="12" fill="#334155">developer team</text>
<text x="640" y="120" text-anchor="middle" font-size="12" fill="#64748b">repository</text>
<line x1="561" y1="92.0" x2="579" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="721" y="46" width="118" height="92" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="780" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">6 Accept</text>
<text x="780" y="100" text-anchor="middle" font-size="12" fill="#334155">group lead</text>
<text x="780" y="120" text-anchor="middle" font-size="12" fill="#64748b">test app</text>
<line x1="701" y1="92.0" x2="719" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="861" y="46" width="118" height="92" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="920" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">7 Release</text>
<text x="920" y="100" text-anchor="middle" font-size="12" fill="#334155">owner</text>
<text x="920" y="120" text-anchor="middle" font-size="12" fill="#64748b">main</text>
<line x1="841" y1="92.0" x2="859" y2="92.0" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M220,138 V172 H80 V142" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="150" y="166" text-anchor="middle" font-size="12" fill="#475569">an edit takes the signature off</text>
<path d="M500,138 V208 H80 V142" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="290" y="202" text-anchor="middle" font-size="12" fill="#475569">re-issue opens a sealed node again</text>
<path d="M780,138 V172 H500 V142" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="640" y="166" text-anchor="middle" font-size="12" fill="#475569">not accepted: back with reasons</text>
