# The risk register (adcs-risk-register/1). SPEC.md §5.13.
#
# WHAT THIS FILE IS. Every risk the platform carries, one [[risk]] each, with
# its level now and every move of that level. The layer-1 risk rows
# (mgt_risk_management) are counted from this file and derisk/beliefs/ by
# `cargo xtask derisk rollup`; a node form never sets them.
#
# THE RULES (tools/derisk.py check, and `cargo xtask derisk check` in CI):
# * A level moves only through a belief record (derisk/beliefs/<id>.toml),
#   and the move is written in both places: the belief's [[move]] tables and
#   this risk's `history`, with the same quarter, from, to and belief id.
# * A level goes DOWN only when the belief that moves it was tested: its
#   status is `held` or `broke`, and `tested` says what was done. Nothing is
#   lowered by argument, by review or by time passing.
# * A level may go UP at any time, by any belief, tested or not. Bad news is
#   recorded the day it is known, never saved for a meeting.
# * Level 0 means closed. A closed risk stays in the file.
# * `owner` is a team (SPEC.md §5.9), never a person.
#
# THE LEVELS here are PROPOSED by the planning package that wrote this file,
# from SPEC.md §21 as it stood. None is the result of a test. Decision D26
# confirms the scale and every starting level at P1; until then each history
# entry says "proposed".

schema = "adcs-risk-register/1"

[[level]]
n = 1
name = "negligible"
meaning = "if it happens, one run is repeated"

[[level]]
n = 2
name = "minor"
meaning = "if it happens, one node needs a new version"

[[level]]
n = 3
name = "significant"
meaning = "if it happens, a release is withdrawn or a quote is redone"

[[level]]
n = 4
name = "major"
meaning = "if it happens, a result already delivered, or a certificate, is in doubt"

[[level]]
n = 5
name = "critical"
meaning = "if it happens, delivery stops, or something leaves that must not"

[[area]]
id = "node"
label = "nodes"
covers = "the tree: which nodes exist, what each one is, how they connect"

[[area]]
id = "input"
label = "case inputs"
covers = "the case CSV, its format, and what a run reads from it"

[[area]]
id = "output"
label = "outputs and results"
covers = "result documents, certificates, exports, what leaves the company"

[[area]]
id = "model"
label = "models"
covers = "the plant, the environment, the rig, and how far each stands in for orbit"

[[area]]
id = "math"
label = "maths"
covers = "the relations in adcs-core::physics and the assumptions under them"

[[area]]
id = "algorithm"
label = "algorithms"
covers = "estimation, control, tuning, the solver and the designer"

[[area]]
id = "visualisation"
label = "visualisation"
covers = "every page a person reads: forms, results, the library, the manuals"

