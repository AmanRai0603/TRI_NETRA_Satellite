        var vlines = [], tm = timeMetric();

          var got = run.metrics && run.metrics[tm.m.id];
          if (got !== null && got !== undefined) vlines.push({ x: got, label: tm.m.id + " " + fmt(got) + " min" });
        }
        var groups = R.channels.groups;
        if (!groups) {   // no views declared: one chart per unit, attitude quaternion left to the 3D view
          var byUnit = {};
          R.channels.names.forEach(function (nm, k) { if (/^q_/.test(nm)) return; var u = R.channels.units[k]; (byUnit[u] = byUnit[u] || []).push(nm); });

        }
        var palette = ["--s1", "--s2", "--s3", "--s4"];
        var otherP = OTHER && OTHER.channels.runs && Object.keys(OTHER.channels.runs).length ? decode(OTHER, Object.keys(OTHER.channels.runs)[0]) : Promise.resolve(null);
        otherP.then(function (oc) {
          var pair = null;
          groups.forEach(function (gdef, gi) {
            var series = gdef.channels.slice(0, 4).map(function (nm, k) { return { name: (gdef.labels || [])[k] || nm, color: css(palette[k]), x: tmin, y: c[nm] }; });
            if (gi === 0 && oc && oc[gdef.channels[0]]) {
              var on = OTHER.channels.n, orate = OTHER.channels.rate_hz, ot = new Float32Array(on); for (var j = 0; j < on; j++) ot[j] = j / orate / 60;
              series.push({ name: series[0].name + ", compared file", color: css("--ink-2"), x: ot, y: oc[gdef.channels[0]], dash: true });
            }
            var target = host;
            if (gdef.half) { if (!pair) { pair = el("div", { class: "two" }); host.appendChild(pair); } target = pair; } else pair = null;

              vlines: gdef.time_marks ? vlines : [], hlines: gdef.hline ? [gdef.hline] : [] });
          });
          if (c.q_w) attitude(ah, c, tmin);
        });
      }).catch(function (e) { host.appendChild(el("p", { class: "muted", text: "Channels could not be read: " + e.message })); });
    }
    sel.addEventListener("change", drawRun);
    if (kept.length) drawRun(); else host.appendChild(el("p", { class: "muted", text: "This file kept no channels." }));

    // Campaign
    if ((R.runs || []).length > 1) {
      var cp = card("Campaign: " + R.campaign.type + ", " + R.runs.length + " runs", "reference", "Dispersed: " + (R.campaign.dispersed || []).join(", ") + " · seed " + R.campaign.seed + ". Each histogram is on its metric's own axis; the requirement and the statistic are marked. Click a kept run to show it above.");
      var hh = el("div", { class: "two" }); cp.appendChild(hh);
      (R.metrics || []).forEach(function (x) {
        var req = (R.requirements || []).filter(function (r) { return r.key === x.requirement; })[0];
        var lines = []; if (req) lines.push({ x: req.value, label: "required" }); if (x.ensemble.value !== null && isFinite(x.ensemble.value)) lines.push({ x: x.ensemble.value, label: x.ensemble.statistic });
        histogram(hh, x.id, x.unit, x.values, lines);
      });
      var rt = el("table"), rh = el("tr"); ["run", "kept"].concat((R.metrics || []).map(function (x) { return x.id + " [" + x.unit + "]"; })).forEach(function (h, i) { rh.appendChild(el("th", { class: i > 1 ? "num" : null, text: h })); });
      rt.appendChild(el("thead", null, [rh])); var rb = el("tbody");
      R.runs.forEach(function (r) { var row = el("tr", { class: r.kept ? "clickable" : null }, [el("td", { text: String(r.k) }), el("td", { text: r.kept ? "yes" : "" })]);
        (R.metrics || []).forEach(function (x) { row.appendChild(el("td", { class: "num", text: fmt(r.metrics[x.id]) })); });
        if (r.kept) row.addEventListener("click", function () { sel.value = String(r.k); drawRun(); th.scrollIntoView(); });
        rb.appendChild(row); });
      rt.appendChild(rb);
      cp.appendChild(el("details", null, [el("summary", { text: "Every run" }), el("div", { class: "scroll" }, [rt])]));
      main.appendChild(cp);
    }

    // Provenance and the case
    var pv = card("Where this came from", "reference");
    var pt = el("table"), pb = el("tbody");
    [["engine", (eng.name || "") + " · " + (eng.version || "") + " · " + (eng.commit || "")], ["case", R.case.id + " · hash " + R.case.hash],
     ["product", R.product.id + " · " + R.product.family + " · " + (R.product.parts || []).join(", ")], ["tuned set", R.tuned && R.tuned.hash ? R.tuned.hash : (R.tuned && R.tuned.note) || "—"],
     ["scenario", R.scenario.id], ["campaign", R.campaign ? (R.campaign.type + (R.campaign.id ? " · " + R.campaign.id : "") + " · seed " + R.campaign.seed) : "—"],
     ["restricted content left out", (R.restricted_excluded || []).join(", ") || "none"]].forEach(function (r) { pb.appendChild(el("tr", null, [el("th", { text: r[0] }), el("td", { class: "mono", text: r[1] })])); });
    pt.appendChild(pb); pv.appendChild(el("div", { class: "scroll" }, [pt]));
    var cd = el("details", null, [el("summary", { text: "The case, exactly as it was run" })]);
    var rows = R.case.csv.trim().split("\n").map(function (l) { return l.split(","); });
    var ct = el("table"); rows.slice(0, 1).forEach(function (r) { var tr = el("tr"); r.forEach(function (c) { tr.appendChild(el("th", { text: c })); }); ct.appendChild(el("thead", null, [tr])); });
    var cb = el("tbody"); rows.slice(1).forEach(function (r) { if (!r[4]) return; var tr = el("tr"); r.slice(0, 9).forEach(function (c) { tr.appendChild(el("td", { text: c })); }); cb.appendChild(tr); });
    ct.appendChild(cb); cd.appendChild(el("p", { class: "tiny", text: "Rows with a value; the CSV download has every row." }));
    cd.appendChild(el("div", { class: "scroll" }, [ct]));
    cd.appendChild(el("button", { text: "Download the case CSV", onclick: function () { download(R.case.csv, R.case.id + ".csv", "text/csv"); } }));
    pv.appendChild(cd);
    main.appendChild(pv);

    var br = card("Where this result breaks", "explanation");
    var bl = el("div", { class: "xk-box breaks", "data-explain": "breaks" }, [el("div", { class: "xk-h", text: "Read every verdict above with these in mind" })]);
    var lim = el("ul");
    (R.limits || []).forEach(function (t) { lim.appendChild(el("li", { text: t })); });
    if (R.unconfirmed && R.unconfirmed.length) lim.appendChild(el("li", { text: "Rows read that nobody has confirmed yet: " + R.unconfirmed.join(", ") + "." }));
    (R.requirements || []).forEach(function (q) { if (q.level_assumed) lim.appendChild(el("li", { text: q.label + ": the level " + q.level + " % was assumed, not stated by the case." })); });
    if (!lim.children.length) lim.appendChild(el("li", { text: "This file names no limits. Ask the developer team why: every result has some." }));
    bl.appendChild(lim); br.appendChild(bl);
    br.appendChild(el("div", { class: "xk-box wrong", "data-explain": "wrong-idea" }, [el("div", { class: "xk-h", text: "Common wrong idea" }),
      document.createTextNode("“A pass means the satellite will meet the requirement in orbit.” "),
      el("div", { "data-explain": "because", text: "A pass means this model, with this case and these assumptions, met the requirement at the stated level. What the model leaves out is listed above. Only the rungs above SILS (OILS, HILS, then flight) raise how far a pass can be trusted." })]));
    main.appendChild(br);

    var tb2 = el("section", { class: "card", "data-kind": "tutorial", "data-show": "learn", "data-explain": "teach-back" }, [el("h2", { text: "Explain it back" })]);
    if (X) tb2.querySelector("h2").appendChild(X.badge("tutorial"));
    tb2.appendChild(el("p", { text: "In two lines, as you would to a colleague: what does this result say, and what would make it wrong?" }));
    tb2.appendChild(el("textarea", { "aria-label": "Your explanation", style: "width:100%;min-height:70px" }));
    tb2.appendChild(el("p", { class: "tiny", text: "This stays on this page; it is not saved into the file." }));
    main.appendChild(tb2);
    main.appendChild(el("p", { class: "lead", "data-explain": "one-line" }, [el("b", { text: "In one line: " }), (judged.length ? passed + "/" + judged.length + " pass" : "no requirement judged") + " on the " + (eng.name || "?") + " engine; read the limits before you use it."]));
    if (X) X.setDepth(document.body.getAttribute("data-depth") || "read");
  }
  function timeMetric() {
    var out = null;
    (R.metrics || []).forEach(function (m) { if (out || !m.requirement) return;
      var req = (R.requirements || []).filter(function (r) { return r.key === m.requirement; })[0];
      if (req && req.unit === "Minute" && m.unit === "Minute") out = { m: m, req: req }; });
    return out;
  }
  function metricsCsv() {
    var lines = ["run," + (R.metrics || []).map(function (x) { return x.id + " [" + x.unit + "]"; }).join(",")];
    (R.runs || []).forEach(function (r) { lines.push(r.k + "," + (R.metrics || []).map(function (x) { var v = r.metrics[x.id]; return v === null || v === undefined ? "" : v; }).join(",")); });
    download(lines.join("\n") + "\n", R.case.id + "_" + R.scenario.id + "_metrics.csv", "text/csv");
  }
  function channelsCsv(run) {
    decode(R, run).then(function (c) {
      var names = R.channels.names, lines = ["t_s," + names.map(function (n, i) { return n + " [" + R.channels.units[i] + "]"; }).join(",")];
      for (var i = 0; i < R.channels.n; i++) lines.push((i / R.channels.rate_hz) + "," + names.map(function (n) { return c[n][i]; }).join(","));
      download(lines.join("\n") + "\n", R.case.id + "_" + R.scenario.id + "_run" + run + ".csv", "text/csv");
    });
  }

    r.setAttribute("data-theme", dark ? "light" : "dark"); build();
  };

  var fileIn = document.getElementById("file");
  document.getElementById("open").onclick = function () { fileIn.click(); };
  fileIn.addEventListener("change", function () {
    var f = fileIn.files[0]; if (!f) return;
    f.text().then(function (t) {
      var open = '<script type="application/json" id="adcs-result">', i = t.indexOf(open);

      var j = t.indexOf("</" + "script>", i), o = JSON.parse(t.slice(i + open.length, j));

    });
    fileIn.value = "";
  });
  build();
})();
