# A catalogue product: a configuration (which part fills each slot, how many,
# where they are mounted) plus the flight algorithms it carries. Products are
# what the solver offers a case and what the design team adds to (SPEC.md §7.7).
#
# status  candidate — saved, internal only; offered — a person promoted it
#         (H14), so a client may be shown it; retired — kept for old quotes.
# origin  seeded — written by hand into this package; designed — saved by
#         `adcs design`, with its [design] table filled.
# A product holding any SYN-* part is shown everywhere as synthetic; that is
# derived from its parts, never a field someone sets.
# mounts_pending  a reason, when the product does not yet mount every part;
#         a run on it is refused, naming the parts without a mount.
# The tuned parameter values are never stored here: they are per case, in the
# run ledger, and restricted (D1).

# The finalised product on its real parts. Its panels carry nan fields until
# the bench measures them, and its sensors are synthetic until D18, so every
# run on it is refused by name today and it cannot be offered.

schema = "adcs-product/1"
id = "IDM-P-3U-FMR"
label = "3U IDMAS V2 — coils + magneto-fluidic panels"
family = "mtq_fmr"
classes = ["cubesat_3u"]
status = "candidate"
origin = "seeded"
source = "idmas_v2"
algorithms = ["bdot", "mekf", "idmas_split"]
counts = { n_mtq = 3, n_rw = 0, n_fmr = 3, n_rcs = 0, n_st = 1, n_gyro = 1 }

[[fill]]
slot = "coils"
part = "IDM-CT-3U"

[[fill]]
slot = "rings"
part = "IDM-MFP-3U"

[[fill]]
slot = "magnetometer"
part = "SYN-MAG-1"

[[fill]]
slot = "star_tracker"
part = "SYN-ST-1"

[[fill]]
slot = "gyro"
part = "SYN-GYRO-1"

[[fill]]
slot = "controller"
part = "IDM-CTRL-1"

# IDMAS v2 Fig 8, baseline: coil + ring on three faces, coil only on the
# opposite three, ring axes along the panel normals.
[[mount]]
part = "IDM-MFP-3U"
place = "+X"
normal_body = [1.0, 0.0, 0.0]
[[mount]]
part = "IDM-MFP-3U"
place = "+Y"
normal_body = [0.0, 1.0, 0.0]
[[mount]]
part = "IDM-MFP-3U"
place = "+Z"
normal_body = [0.0, 0.0, 1.0]
[[mount]]
part = "IDM-CT-3U"
place = "-X"
normal_body = [-1.0, 0.0, 0.0]
[[mount]]
part = "IDM-CT-3U"
place = "-Y"
normal_body = [0.0, -1.0, 0.0]
[[mount]]
part = "IDM-CT-3U"
place = "-Z"
normal_body = [0.0, 0.0, -1.0]
[[mount]]
part = "SYN-MAG-1"
place = "far corner from the pumps"   # IDMAS v2 §05.1
position_body_m = [0.04, -0.04, -0.15]
[[mount]]
part = "SYN-ST-1"
place = "-Z face"
boresight_body = [0.0, 0.0, -1.0]
[[mount]]
part = "SYN-GYRO-1"
place = "internal"

[design]            # written by `adcs design`; empty for a seeded product
case_hash = ""      # the class standard (or case) it was designed against
campaign_hashes = []  # the SILS campaigns that proved it
envelope = {}       # per case key, the [lo, hi] it held across
worst_margin = nan  # its thinnest margin over every bound requirement

[promotion]         # H14: a person, never an agent
by = ""
date = ""
