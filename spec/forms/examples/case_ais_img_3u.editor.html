<title>Case editor — ais_img_3u</title>
<!--
  ADCS platform case editor, adcs-case-editor/1 (SPEC.md §8.3).

  A case is your whole input to the software: the satellite, its orbit and
  mission, and what its ADCS must achieve. It is always one CSV file in the
  fixed format adcs-case/1, which the web app, the portal and the MATLAB SILS
  tool all read the same way. This page writes that CSV. It works offline,
  opened straight from disk.

  The software checks a case again when you open it (and `adcs case check
  <file.csv>` checks it from a terminal). This page catches typing slips as
  you go, with the same rules.

  The JSON block at the end (id="adcs-case-editor") holds the format and your
  values. "Save editor copy" writes a copy of this page with your values in it;
  "Download CSV" writes the case itself.
-->

        var inp = el("input", { type: "text", "aria-label": r.key + " " + k, disabled: allowed ? null : true, inputmode: k === "note" ? null : "decimal",
          placeholder: !allowed ? "—" : k === "level" ? String(F.default_level) : "", title: !allowed ? (k === "level" ? "only requirements take a level" : "this row takes no range") : "" });
        inp.value = g(r.key, k);
        inp.addEventListener("input", function () { setv(r.key, k, inp.value); paint(); refresh(); });
        inputs[k] = inp; td.appendChild(inp);
        if (k === "note") td.appendChild(err);
        tr.appendChild(td);
      });
    }
    function paint() {
      var e = check(r);
      err.textContent = e;
      tr.classList.toggle("bad", !!e);
      tr.classList.toggle("filled", !!g(r.key, "value"));
      tr.classList.toggle("changed", JSON.stringify(V[r.key] || {}) !== JSON.stringify(START[r.key] || {}) && !(isEmpty(V[r.key]) && isEmpty(START[r.key])));
    }
    rows.push({ r: r, tr: tr, inputs: inputs, paint: paint, text: (r.key + " " + r.label + " " + (r.help || "")).toLowerCase() });
    setTimeout(paint, 0);
    return tr;
  }
  function isEmpty(o) { return !o || ["value", "lo", "hi", "level", "note"].every(function (k) { return !str(o[k]); }); }
  (function () { var d = el("datalist", { id: "dl-classes" }); (F.classes || []).forEach(function (c) { d.appendChild(el("option", { value: c })); }); document.body.appendChild(d); })();

  // The same rules the software's case check applies to one row.
  function check(r) {
    var k = r.key;
    if (r.section === "meta") {
      var v = g(k, "value");
      if (k === "meta.case_id") return !v ? "give the case an id" : (!/^[a-z0-9_]+$/.test(v) ? "lower-case letters, digits and _ only" : "");
      if (k === "meta.class" && v && (F.classes || []).indexOf(v) < 0) return "not a satellite class the software knows";
      if (k === "meta.families" && v) { var bad = v.split(";").filter(function (x) { return (F.families || []).indexOf(x) < 0; }); if (bad.length) return "unknown families: " + bad.join(", "); }
      return "";
    }
    var val = g(k, "value"), lo = g(k, "lo"), hi = g(k, "hi"), lv = g(k, "level");
    if (val && !num(val)) return "value is not a number";
    if (r.section === "req" && num(val) && Number(val) < 0) return "a requirement is a magnitude: not negative";
    if (r.fraction && num(val) && (Number(val) < 0 || Number(val) > 1)) return "a fraction between 0 and 1";
    if ((lo || hi) && !r.range) return "this row takes no range";
    if (!!lo !== !!hi) return "give both lo and hi, or neither";
    if (lo && hi && !(num(lo) && num(hi) && Number(lo) < Number(hi))) return "lo must be a number below hi";
    if (val && lo && hi && (Number(val) < Number(lo) || Number(val) > Number(hi))) return "the value lies outside lo…hi";
    if (lv && !r.level) return "only requirements take a level";
    if (lv && !(num(lv) && Number(lv) > 0 && Number(lv) < 100)) return "level is a per cent between 0 and 100";
    if (lv && !val) return "a level needs a value";
    return "";
  }

  // ------------------------------------------------------------------ is it ready?
  var readyCard = card("ready", "Is it ready?", "What the software will be able to run with this case, and what a blank will block. Nothing is guessed: a blank “stated” input blocks exactly the results that need it.", "reference");
  function readiness() {
    var inputs = F.rows.filter(function (r) { return r.section !== "meta" && r.section !== "req"; });
    var reqs = F.rows.filter(function (r) { return r.section === "req"; });
    var stated = inputs.filter(function (r) { return g(r.key, "value"); });
    var unstated = inputs.filter(function (r) { return !g(r.key, "value") && r.blank === "stated"; });
    var assumed = inputs.filter(function (r) { return !g(r.key, "value") && r.blank === "default"; });
    var written = reqs.filter(function (r) { return g(r.key, "value"); });
    var unconf = F.rows.filter(function (r) { return g(r.key, "value") && /^UNCONFIRMED/.test(g(r.key, "note")); });
    var levelAssumed = written.filter(function (r) { return !g(r.key, "level"); });
    var scen = (F.scenarios || []).map(function (s) {
      var miss = s.reads.filter(function (k) { var r = F.rows.filter(function (x) { return x.key === k; })[0]; return r && r.blank === "stated" && !g(k, "value"); });
      var binds = s.binds.filter(function (k) { return g(k, "value"); });
      return { id: s.id, label: s.label, missing: miss, binds: binds, all: s.binds };
    });
    return { inputs: inputs, reqs: reqs, stated: stated, unstated: unstated, assumed: assumed, written: written, unconf: unconf, levelAssumed: levelAssumed, scen: scen };
  }
  function problems() {
    var out = [];
    rows.forEach(function (x) { var e = check(x.r); if (e) out.push({ level: "error", key: x.r.key, text: x.r.key + ": " + e }); });
    var R = readiness();
    if (!R.written.length) out.push({ level: "warn", key: "req.ape", text: "No requirement is written: the software can run, but nothing can pass or fail." });
    if (R.unconf.length) out.push({ level: "warn", key: R.unconf[0].key, text: R.unconf.length + " value(s) marked UNCONFIRMED: results that use them say so." });
    return out;
  }
  function refresh() {
    var R = readiness(), P = problems(), errs = P.filter(function (x) { return x.level === "error"; });
    var blocked = R.scen.filter(function (x) { return x.missing.length; }).length;
    answerEl.textContent = (errs.length ? "Not ready: " + errs.length + " row" + (errs.length === 1 ? " breaks" : "s break") + " the case format, and the software will refuse the file. " :
      "The format is right. ") + R.written.length + " of " + R.reqs.length + " requirements are written; " + R.unstated.length + " inputs are unstated" +
      (R.scen.length ? ", which block " + blocked + " of " + R.scen.length + " scenarios" : "") + "; " + R.assumed.length + " will take the reference value, listed. Download the CSV when you are done.";
    var cc = document.getElementById("crumb-case"); if (cc) cc.textContent = caseId();
    var chip = document.getElementById("state");
    chip.textContent = errs.length ? errs.length + " to fix" : "format OK";
    chip.className = "chip " + (errs.length ? "bad" : "good");
    Object.keys(counts).forEach(function (id) { counts[id].textContent = ""; counts[id].className = "n"; });
    errs.forEach(function (e) { var sec = "s-" + e.key.split(".")[0]; if (counts[sec]) { counts[sec].textContent = String((Number(counts[sec].textContent) || 0) + 1); counts[sec].className = "n bad"; } });
    counts.ready.textContent = errs.length ? String(errs.length) : "✓"; counts.ready.className = "n" + (errs.length ? " bad" : "");
    var s = readyCard;
    while (s.childNodes.length > 2) s.removeChild(s.lastChild);
    var tiles = el("div", { class: "tiles" });
    [[R.written.length + " / " + R.reqs.length, "requirements written"],
     [R.stated.length + " / " + R.inputs.length, "inputs stated"],
     [String(R.unstated.length), "inputs unstated (block what needs them)"],
     [String(R.assumed.length), "blank → reference value, listed"],
     [String(R.levelAssumed.length), "requirements taking the default level"],
     [String(R.unconf.length), "values marked UNCONFIRMED"]].forEach(function (x) { tiles.appendChild(el("div", { class: "tile" }, [el("div", { class: "v", text: x[0] }), el("div", { class: "k", text: x[1] })])); });
    s.appendChild(tiles);
    var ul = el("ul", { class: "issues" });
    if (!P.length) ul.appendChild(el("li", { class: "ok" }, [el("span", { text: "✓ The format checks pass." })]));
    P.slice(0, 40).forEach(function (x) { ul.appendChild(el("li", { class: x.level }, [el("a", { href: "#k-" + x.key.replace(/\./g, "-"), text: x.text })])); });
    if (P.length > 40) ul.appendChild(el("li", { class: "warn", text: "…and " + (P.length - 40) + " more." }));
    s.appendChild(ul);
    if (R.scen.length) {
      s.appendChild(el("h3", { text: "Scenarios in this release" }));
      var t = el("table"), tr = el("tr");
      ["scenario", "can it run?", "requirements it judges that this case writes"].forEach(function (h) { tr.appendChild(el("th", { text: h })); });
      t.appendChild(el("thead", null, [tr]));
      var tb = el("tbody");
      R.scen.forEach(function (x) {
        tb.appendChild(el("tr", null, [el("td", null, [el("div", { class: "mono", text: x.id }), el("div", { class: "help", text: x.label })]),
          el("td", { text: x.missing.length ? "blocked — needs " + x.missing.join(", ") : "yes" }),
          el("td", { text: x.binds.length ? x.binds.join(", ") : (x.all.length ? "none of " + x.all.join(", ") : "—") })]));
      });
      t.appendChild(tb); s.appendChild(el("div", { class: "scroll" }, [t]));
      s.appendChild(el("p", { class: "tiny", text: "A scenario also needs a product whose family it can verify; the software chooses or you pick one. This table covers only what the case decides." }));
    }
    if (R.assumed.length) s.appendChild(el("p", { class: "muted", text: "Will take the reference value (listed in the report): " + R.assumed.map(function (r) { return r.key; }).join(", ") + "." }));
    s.appendChild(el("div", { class: "row-actions" }, [el("button", { class: "primary", text: "Download CSV", onclick: downloadCsv }), el("button", { text: "Save editor copy", onclick: saveCopy })]));
    s.appendChild(el("p", { class: "tiny", text: "Next: open the CSV in the software and run. From a terminal, `adcs case check " + caseId() + ".csv` prints this same report." }));
    try { if (JSON.stringify(V) !== JSON.stringify(START)) localStorage.setItem(DRAFT_KEY, JSON.stringify({ values: V, at: new Date().toISOString() })); } catch (e) { /* no storage: the downloaded CSV is the record */ }
  }

  // ------------------------------------------------------------------ files
  function parseCsv(text) {
    var out = [], rowa = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { rowa.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; rowa.push(cell); out.push(rowa); rowa = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || rowa.length) { rowa.push(cell); out.push(rowa); }
    if (!out.length || out[0].join(",") !== F.columns.join(",")) return { error: "That file's header is not the case format. It must be: " + F.columns.join(",") };
    var values = {}, bad = [];
    out.slice(1).forEach(function (r) {
      if (r.length < F.columns.length) return;
      var known = F.rows.filter(function (x) { return x.key === r[1]; })[0];
      if (!known) { bad.push(r[1] + " (not a key of " + F.format + ")"); return; }
      if (known.section !== "meta" && r[3] !== known.unit) bad.push(r[1] + " (unit " + r[3] + "; the format says " + known.unit + ")");
      values[r[1]] = { value: r[4], lo: r[5], hi: r[6], level: r[7], note: r[8] };
    });
    if (bad.length) return { error: "Not opened. These rows are not in the case format:\n" + bad.join("\n") };
    return { values: values };
  }
  function load(values, from) {
    Object.keys(V).forEach(function (k) { delete V[k]; });
    Object.keys(values || {}).forEach(function (k) { if (k !== "meta.schema") V[k] = JSON.parse(JSON.stringify(values[k])); });
    rows.forEach(function (x) { for (var k in x.inputs) { if (x.r.key === "meta.schema") continue; x.inputs[k].value = g(x.r.key, k); } x.paint(); });
    F.loaded_from = from;
    refresh(); toast("Loaded " + from);
  }
  function cell(s) { s = str(s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function caseCsv() {
    var out = [F.columns.join(",")];
    F.rows.forEach(function (r) {
      var v = r.key === "meta.schema" ? F.format : g(r.key, "value");
      out.push([r.section, r.key, r.label, r.section === "meta" ? "" : r.unit, v,
        r.section === "meta" ? "" : g(r.key, "lo"), r.section === "meta" ? "" : g(r.key, "hi"), r.section === "meta" ? "" : g(r.key, "level"), r.section === "meta" ? "" : g(r.key, "note")].map(cell).join(","));
    });
    return out.join("\n") + "\n";
  }
  function caseId() { return g("meta.case_id", "value") || "case"; }
  function download(blob, name) { var a = el("a", { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  function downloadCsv() {
    var n = problems().filter(function (x) { return x.level === "error"; }).length;
    if (n && !confirm(n + " row(s) break the format, and the software will refuse the file. Download anyway?")) return;
    download(new Blob([caseCsv()], { type: "text/csv" }), caseId() + ".csv");
  }
  function saveCopy() {
    var json = JSON.stringify(F, null, 1).replace(/</g, "\\u003c");
    var open = '<script type="application/json" id="adcs-case-editor">';
    var i = PRISTINE.indexOf(open), j = PRISTINE.indexOf("</" + "script>", i);
    download(new Blob([PRISTINE.slice(0, i + open.length) + "\n" + json + "\n" + PRISTINE.slice(j)], { type: "text/html" }), caseId() + ".case-editor.html");
    toast("Saved an editor copy");
  }
  document.getElementById("dl").onclick = downloadCsv;
  document.getElementById("savecopy").onclick = saveCopy;

  (function () {
    if (!SAVED || JSON.stringify(SAVED.values) === JSON.stringify(V)) return;
    var b = document.getElementById("draft");
    b.appendChild(el("span", { text: "This browser kept unsaved values from " + str(SAVED.at).slice(0, 16).replace("T", " ") + "." }));
    b.appendChild(el("button", { class: "primary", text: "Restore them", onclick: function () { load(SAVED.values, "the unsaved values"); b.classList.remove("on"); } }));
    b.appendChild(el("button", { text: "Discard", onclick: function () { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} b.classList.remove("on"); } }));
    b.classList.add("on");
  })();
  refresh();
})();
</script>
</body>
</html>
