<!--
  ADCS platform node form, adcs-node-form/1 (SPEC.md §5.10).

  This one file is the node's document, the request form and, once saved, the
  request itself. It opens straight from disk in any browser: no server, no
  network, no account, no external script.

  What it is for. The released software never edits itself. A team member who
  wants a node changed, a new node, a relation confirmed, or who has feedback on
  a release, fills this form and sends the saved file to the developer team.
  The developers run the checker on it (`cargo xtask intake check <file>`), and
  when it passes, implement it, verify it against this form, review and
  release. They send the same file back with their reply in its history.

  EVERYTHING THAT MATTERS IS THE JSON BLOCK AT THE END (id="adcs-node-form").
  The page is drawn from it and "Save filled copy" writes it back into a copy of
  this file. A person or an assistant may edit that block by hand: change only
  `request` and `feedback`. `request.proposed` is the whole node as you want it
  to be; the checker compares it with the node as the software has it, never
  with what this file says the node was. Inside the block every "<" is written
  as <.
-->

el."],["smad2011","Wertz, Everett, Puschell (eds.) — Space Mission Engineering: The New SMAD","Worst-case disturbance summation and momentum-dumping dipole sizing."],["markley2014","Markley, F. L. and Crassidis, J. L. — Fundamentals of Spacecraft Attitude Determination and Control","Estimation and control relations written after the pilot thread."],["igrf14","International geomagnetic reference field: the fourteenth generation","The dipole strength and tilt at the launch epoch, shipped as the igrf14 bundle."],["kopp2011","Kopp, G. and Lean, J. L. — A new, lower value of total solar irradiance","Total solar irradiance of 1360.8 W/m2 at 1 AU for the solar radiation pressure."],["ecss_e_st_60_10c","ECSS-E-ST-60-10C — Space engineering: Control performance","Performance-error indices and the rule for summing independent contributors in the pointing budget."],["ogata2010","Ogata, K. — Modern Control Engineering, 5th ed.","The 2 per cent settling time of a second-order loop."],["nrlmsis2","Emmert, J. T. et al. — NRLMSIS 2.0: A whole-atmosphere empirical model of temperature and neutral species densities","The density-against-altitude table shipped as the atmos-density bundle, at low, mean and high solar activity."],["synthetic_test_parts","Synthetic catalogue parts for software tests","Round numbers that let every family be exercised in tests. Never quotable, never evidence."],["avanzini2012","Avanzini, G. and Giulietti, F. — Magnetic Detumbling of a Rigid Spacecraft","The B-dot gain the bdot algorithm's gain_scale multiplies (catalogue/algorithms/bdot.toml)."],["cds14_1","CubeSat Design Specification, Rev. 14.1 — The CubeSat Program, Cal Poly SLO","The mass limit of each CubeSat class in catalogue/classes.toml."],["schwartz2003","Schwartz, J. L., Peck, M. A., Hall, C. D. — Historical Review of Air-Bearing Spacecraft Simulators","The air-bearing platform rows (fa5) and the bearing needs (h_tbear, h_cmoff, h_tilt): a bearing's residual torque is the weight it carries times its centre-of-mass offset, and tabletop and umbrella bearings limit tilt."],["ibrahim2026","Ibrahim et al. — Air-Bearing Testbeds for CubeSat and Nanosatellite (review)","Typical CubeSat bearing figures a request may compare against: automatic mass balancing to micrometre-level offsets, tilt ranges of about ±45 to ±50 degrees, and the gravity torque of a given offset. A preprint: a form citing it says so."],["dasilva2019","da Silva, R. C., Ishioka, I. S. K., Cappelletti, C., Battistini, S., Borges, R. A. — Helmholtz Cage Design and Validation for Nanosatellites HWIL Testing","The magnetic field simulator rows (fa3) and the cage needs (h_brng, h_bacc, h_bslew): what a cage is specified by, and how an orbit's field is commanded and checked with a reference magnetometer."],["astm_e927","ASTM E927-19 — Standard Classification for Solar Simulators for Electrical Performance Testing of Photovoltaic Devices","How the Sun simulator's non-uniformity and temporal instability (f_sununi, f_sunstab) are stated and classed. The class limits are read from the standard itself."],["zhao2024","Zhao, H., Zhuang, A., Lembeck, M. F. — A Low-Cost, Hardware-in-the-Loop Simulator Facilitating CubeSat Star Tracker Development","The star stimulator rows (f_star, f_starmag, f_starfr, f_starlat) and needs (h_starerr, h_starfr): a star stimulator's angular step is the display's pixel pitch over the collimator's focal length."],["bremer2017","Bremer, L., Fernández Garcia, V., Neefs, M., Agenjo Diaz, A. — The Euclid AOCS simulation facilities","One model reused across every facility: the MATLAB engineering simulator's models carried into the real-time simulator, one parameter database for all, and the real-time simulator run at twice the on-board cycle. The pattern the MATLAB twin's lockstep (SPEC.md §10.8.7) and the rig's reuse of adcs-sim-core follow."],["colagrossi2023","Colagrossi, A., Silvestrini, S., Lavagna, M. — Flat-Sat Facility for Processor-in-the-Loop Verification and Testing of Nanosatellite ADCS","The OILS rig rows (fa2) and needs (v3): interface emulation of UART, I2C, SPI, CAN and PWM on the flight connectors, a missed-tick count with an allowed share, galvanic isolation of the OBC, and one functional simulator shared by the model-in-the-loop and processor-in-the-loop stages."],["nadeem2022","Nadeem, S. — Empirical Methods for Reaction Wheel Micro-Vibration Verification in a Production Environment","The wheel test stand rows (f_dynbw, f_imb) and the wheel need (h_rwd): static and dynamic imbalance from a multi-component force dynamometer at speed and over a run-down."],["springmann2010","Springmann, J. C., Cutler, J. W. — Magnetic Sensor Calibration and Residual Dipole Characterization for Application to Nanosatellites","How a coil's dipole and the satellite's residual dipole are measured with magnetometers (f_dipres, h_dip)."],["ecss_e_tm_10_21a","ECSS-E-TM-10-21A — System modelling and simulation","The names and roles of the simulation facilities a project uses (functional engineering simulator, software validation facility, real-time test bench) and model reuse across them."],["ecss_m_st_80c","ECSS-M-ST-80C, Space project management — Risk management","The idea behind the risk levels L1–L5 and the rule that a risk is lowered only by an action whose result is recorded. The mapping from its severity and likelihood scores to our five levels is decision D26, not the standard's."],["adcs_derisk_method","Quarterly De-risking Narrative — the company's template; derisk/narrative_template.xlsx is regenerated from its title and columns by tools/derisk.py template","The fields of a belief record (SPEC.md §5.13), the quarterly narrative's columns, and the counts the risk rows are rolled up from."]],"risks":[["R-01","The tree is mostly unwritten",4,"node"],["R-02","Requests arrive faster than the developer team can take them",3,"node"],["R-03","A request is complete but wrong",4,"math"],["R-04","The IDMAS parts are mostly unmeasured",4,"model"],["R-0 <script>
(function () {

  // The file as loaded, before anything is drawn: a saved copy is this with only

  var F = JSON.parse(document.getElementById("adcs-node-form").textContent);

  // ------------------------------------------------------------------ helpers
  function el(tag, attrs, kids) {

    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function str(v) { return v === null || v === undefined ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v)); }
  function same(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }

  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(function () { t.classList.remove("on"); }, 1800); }
  function slug(s) { return str(s).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }
  function num(v) { return v !== "" && v !== null && v !== undefined && isFinite(Number(v)); }
  function get(obj, path) { return path.split(".").reduce(function (o, k) { return o === null || o === undefined ? undefined : o[k]; }, obj); }
  function put(obj, path, v) { var ks = path.split("."), o = obj; for (var i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = v; }
  function cur(path) { return N ? get(N, path) : undefined; }
  function datalist(id, items) {

    (items || []).forEach(function (it) { d.appendChild(el("option", { value: Array.isArray(it) ? it[0] : it, label: Array.isArray(it) ? it[1] : null })); });
    document.body.appendChild(d);

  }
  var UNITS = {}; (CAT.units || []).forEach(function (u) { UNITS[u[0]] = { symbol: u[1], quantities: u[2], note: u[3] }; });
  var NODES = {}; (CAT.nodes || []).forEach(function (x) { NODES[x[0]] = { tree: x[1], label: x[2], type: x[3], unit: x[4], layer: x[5], group: x[6], kind: x[7] }; });
  var SOURCES = {}; (CAT.sources || []).forEach(function (s) { SOURCES[s[0]] = s[1]; });

  datalist("dl-quantities", CAT.quantities || []);

  var main = document.getElementById("main"), nav = document.getElementById("nav");

    teach: "tutorial" };
  function card(id, title, lead) {

    if (lead) s.appendChild(el("p", { class: "lead", text: lead }));

    var count = el("span", { class: "n" });

    nav.appendChild(link);
    sections[id] = { card: s, count: count, link: link };
    return s;
  }
  function setCount(id, text, cls) { var s = sections[id]; if (s) { s.count.textContent = text; s.count.className = "n" + (cls ? " " + cls : ""); } }
  function show(id, on) { var s = sections[id]; if (s) { s.card.classList.toggle("off", !on); s.link.classList.toggle("off", !on); } }

  // What is being asked, and of what kind of node
  var TYPES = [
    ["change", "Change this node", "Correct or complete what it says: its relation, inputs, bounds, value, test vectors."],
    ["new", "Ask for a new node", "Something the tree does not answer yet. Say where it goes and how it is computed."],
    ["confirm", "Confirm this node", "You have checked the relation, its source and its values, and you stand behind them. Nothing else changes."],
    ["feedback", "Feedback on a release", "The software behaved in a way you did not expect. Nothing to change yet."],

  ];
  function kind() { return N ? N.kind : (R.placement.kind || "computed"); }

  // ------------------------------------------------------------------ header

  document.getElementById("theme").onclick = function () {
    var r = document.documentElement, dark = r.getAttribute("data-theme") === "dark" ||

    r.setAttribute("data-theme", dark ? "light" : "dark");
  };
  document.getElementById("print").onclick = function () { window.print(); };

  // ------------------------------------------------------------------ fields
  // One field: what it asks, why it matters, an example, the value now, the control.
  var fields = [];
  function field(parent, o) {
    // o: {path, ask, why, eg, shape: line|prose|number|choice|unit|quantity|source|node|tags, options, required, when}
    var box = el("div", { class: "field" });
    var left = el("div", null, [el("div", { class: "ask" }, [o.ask, o.required ? el("span", { class: "req", text: "*", title: "needed" }) : null]),
      el("div", { class: "why", text: o.why || "" })]);
    if (o.eg) left.appendChild(el("div", { class: "eg", text: "e.g. " + o.eg }));
    var ctl;
    if (o.shape === "prose" || o.shape === "lines") ctl = el("textarea", { "aria-label": o.ask });
    else if (o.shape === "choice") {
      ctl = el("select", { "aria-label": o.ask });
      ctl.appendChild(el("option", { value: "", text: "—" }));
      (o.options || []).forEach(function (x) { ctl.appendChild(el("option", { value: Array.isArray(x) ? x[0] : x, text: Array.isArray(x) ? x[1] : x })); });
    } else if (o.shape === "tags") {
      ctl = el("div", { class: "tags", role: "group", "aria-label": o.ask });
      (o.options || []).forEach(function (t) {
        var cb = el("input", { type: "checkbox", value: t });
        cb.addEventListener("change", function () {
          var v = Array.prototype.filter.call(ctl.querySelectorAll("input"), function (i) { return i.checked; }).map(function (i) { return i.value; });
          put(P, o.path, v); paint(); refresh();
        });
        ctl.appendChild(el("label", null, [cb, " " + t]));
      });
    } else {
      ctl = el("input", { type: "text", "aria-label": o.ask, inputmode: o.shape === "number" ? "decimal" : null,
        list: o.shape === "unit" ? "dl-units" : o.shape === "quantity" ? "dl-quantities" : o.shape === "node" ? "dl-nodes" : null,
        spellcheck: o.shape === "line" || o.shape === "prose" ? null : "false" });
    }
    if (o.shape === "source") ctl.setAttribute("list", datalist("dl-sources-live", []));
    if (o.placeholder) ctl.setAttribute("placeholder", o.placeholder);
    var err = el("div", { class: "err" }), was = el("div", { class: "was" });
    var right = el("div", null, [ctl, err, was]);
    var reset = el("button", { class: "ghost", text: "Reset to what the node says now", onclick: function () { put(P, o.path, clone(cur(o.path) === undefined ? "" : cur(o.path))); load(); paint(); refresh(); } });
    if (N) right.appendChild(el("div", { class: "row-actions" }, [reset]));
    box.appendChild(left); box.appendChild(right);
    parent.appendChild(box);
    function load() {
      var v = get(P, o.path);
      if (o.shape === "tags") Array.prototype.forEach.call(ctl.querySelectorAll("input"), function (i) { i.checked = (v || []).indexOf(i.value) >= 0; });
      else if (o.shape === "list") ctl.value = (Array.isArray(v) ? v : []).join(", ");
      else if (o.shape === "lines") ctl.value = (Array.isArray(v) ? v : []).join("\n");
      else ctl.value = str(v);
    }
    function paint() {
      var v = get(P, o.path), c = cur(o.path);
      var changed = N && !same(v === "" ? "" : v, c === undefined ? "" : c) && !(str(v) === "" && str(c) === "");
      box.classList.toggle("changed", !!changed);
      was.textContent = changed ? "now: " + (str(c) || "(empty)") : "";
      reset.style.display = changed ? "" : "none";
      err.textContent = o.check ? (o.check(v) || "") : "";
    }
    if (o.shape !== "tags") ctl.addEventListener("input", function () {
      var v = ctl.value;
      if (o.shape === "number" && num(v)) v = Number(v);
      if (o.shape === "list") v = v.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
      if (o.shape === "lines") v = v.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      put(P, o.path, v); paint(); refresh();
    });
    if (o.shape === "choice") ctl.addEventListener("change", function () { put(P, o.path, ctl.value); paint(); refresh(); });
    load(); paint();
    var f = { box: box, o: o, paint: paint, load: load };
    fields.push(f);
    return f;
  }

  // An editable table over an array of objects in P.
  var tables = [];
  function tableEditor(parent, o) {
    // o: {path, columns: [{key, label, shape, options, list, width}], blank(), why, ask, onchange}
    var box = el("div", { class: "box" });
    var head = el("div", { class: "head" }, [el("div", null, [el("div", { class: "ask", text: o.ask }), el("div", { class: "why", text: o.why || "" })])]);
    var was = el("div", { class: "was" });
    box.appendChild(head);
    if (o.eg) box.appendChild(el("div", { class: "eg", text: "e.g. " + o.eg }));
    var holder = el("div", { class: "scroll" });
    box.appendChild(holder); box.appendChild(was);
    var acts = el("div", { class: "row-actions" });
    box.appendChild(acts);
    parent.appendChild(box);
    function rows() { var r = get(P, o.path); if (!Array.isArray(r)) { r = []; put(P, o.path, r); } return r; }
    function draw() {
      clear(holder);
      var cols = typeof o.columns === "function" ? o.columns() : o.columns;

      cols.forEach(function (c) { tr.appendChild(el("th", { text: c.label, style: c.width ? "width:" + c.width : null })); });
      tr.appendChild(el("th", { text: "" }));
      t.appendChild(el("thead", null, [tr]));
      var tb = el("tbody");
      rows().forEach(function (r, i) {
        var row = el("tr");
        cols.forEach(function (c) {
          var td = el("td"), ctl;

    else if (isAgent(R.requested_by)) E("who", "“Your name” must be a person's name, not a tool's or an assistant's.");

    if (t === "confirm" && !str(R.attested_by).trim()) E("who", "To confirm the node, give the name of the engineer who checked it.");
    if (t === "feedback" && !F.feedback.length) E("feedback", "Add at least one feedback entry.");
    F.feedback.forEach(function (fb, i) { if (!str(fb.observed).trim()) E("feedback", "Feedback " + (i + 1) + ": say what happened."); });
    if (t === "other" && (!str(R.other.subject).trim() || !str(R.other.description).trim())) E("other", "Give a subject and describe what you need.");
    if ((t === "change" || t === "new" || t === "confirm") && !str(R.reason).trim()) E("who", "Say why.");
    var dfilled = ["area", "believed", "status", "tested", "now_know", "plan_change", "previous_issue", "benefit", "would_test", "cost_k"].some(function (k) { return str(D[k]).trim(); }) || D.moves.length;
    if (t === "change" || t === "new" || (t === "confirm" && dfilled)) {
      if (!str(D.believed).trim()) E("derisk", "Say what was believed: the belief this request rests on (D01).");
      if (AREAS.indexOf(D.area) < 0) E("derisk", "Choose the area the belief is about (D01).");
      if (!str(D.now_know).trim()) E("derisk", "Say what we now know (D01).");
      if (!str(D.plan_change).trim()) E("derisk", "Say what changed in the plan (D01).");
      if (t === "change" && (!str(D.previous_issue).trim() || !str(D.benefit).trim())) E("derisk", "Say what was wrong with the version it replaces, and what this version gives (D02).");
      if (["broke", "held", "untested"].indexOf(D.status) < 0) E("derisk", "Say whether a test has settled the belief (D03).");
      else if (D.status !== "untested" && !str(D.tested).trim()) E("derisk", "Say what was tested (D03).");
      else if (D.status === "untested" && !str(D.would_test).trim()) E("derisk", "Say what test would settle it (D03).");
      else if (D.status === "untested") W("derisk", "The belief is untested: it stays counted under “Beliefs not yet tested” until a test is recorded.");
      if (str(D.cost_k).trim() && !(num(D.cost_k) && Number(D.cost_k) >= 0)) E("derisk", "The cost is a number of thousands of dollars, or blank (D06).");
      D.moves.forEach(function (m, i) {
        var w = "Risk move " + (i + 1);
        if (!m.risk && (!str(m.title).trim() || !str(m.closing_test).trim() || AREAS.indexOf(m.area) < 0)) E("derisk", w + ": a new risk needs a title, an area and the test that would close it (D04).");
        if (Number(m.to) === Number(m.from)) E("derisk", w + ": the level does not change (D04).");
        if (Number(m.to) < Number(m.from) && D.status === "untested") E("derisk", w + ": a level goes down only by a tested belief (D05).");
      });
    }
    if (!editing()) return out;
    var exx = P.explain || {};
    if (str(exx.analogy).trim() && !str(exx.analogy_breaks).trim()) E("explain", "Say where the analogy stops being true (X01).");
    if (str(exx.wrong_idea).trim() && !str(exx.wrong_because).trim()) E("explain", "Say why the wrong idea is wrong (X02).");
    if (k === "computed" && (!str(exx.simply).trim() || !str(exx.one_line).trim())) W("explain", "Say the node simply and in one line: without them its document serves experts only (X03).");
    if (t === "change" && !changeList().length) E("request", "Nothing is changed yet. Change a field, or choose “Feedback” or “Confirm”.");
    if (t === "new") {
      var Pl = R.placement;
      if (!Pl.parent) E("place", "Choose the group the new node belongs to.");
      if (!str(Pl.label).trim()) E("place", "Give the new node a label.");
      if (!Pl.id || !/^[a-z][a-z0-9_]*$/.test(Pl.id)) E("place", "The proposed id needs lower-case letters, digits and _ only.");
      else if (NODES[Pl.id]) E("place", "A node " + Pl.id + " already exists.");
    }
    if (!str(P.question).trim()) E("question", "Write the question it answers.");
    var o = P.output || {};
    if (!o.symbol) E("answer", "Give the answer a symbol.");
    else if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(o.symbol)) E("answer", "The symbol may hold only letters, digits and _.");
    if (!o.type) E("answer", "Say what quantity the answer is.");
    else if ((CAT.quantities || []).indexOf(o.type) < 0) E("answer", o.type + " is not a quantity the software knows.");
    if (!o.unit) E("answer", "Give the answer's unit.");
    else if (!UNITS[o.unit]) E("answer", o.unit + " is not a unit the software knows.");
    else if (o.type && UNITS[o.unit].quantities.indexOf(o.type) < 0) E("answer", o.unit + " does not state " + o.type + ".");
    if (o.lower !== "" && o.lower !== undefined && !num(o.lower)) E("answer", "The lowest value is not a number.");
    if (o.upper !== "" && o.upper !== undefined && !num(o.upper)) E("answer", "The highest value is not a number.");
    if (num(o.lower) && num(o.upper) && Number(o.lower) >= Number(o.upper)) E("answer", "The lowest value must be below the highest.");
    if (num(o.lower) && !str(o.reason_lower).trim()) E("answer", "Say why the lowest value is there.");
    if (num(o.upper) && !str(o.reason_upper).trim()) E("answer", "Say why the highest value is there.");
    if (N && N.case_key && R.type !== "new") {
      if (str(P.label) !== str(N.label)) E("question", "This node is fed by the case key " + N.case_key + ": its label changes only with a new case-format version.");
      if (o.unit !== (N.output || {}).unit || o.type !== (N.output || {}).type) E("answer", "This node is fed by the case key " + N.case_key + ": its quantity and unit change only with a new case-format version.");
    }
    var bindings = [];
    if (k === "computed") {
      var rel = P.relation || {};
      if (!str(rel.expression).trim()) E("relation", "Write the relation.");
      if (!rel.source) E("relation", "Cite a source for the relation.");
      else if (knownSources().indexOf(rel.source) < 0) E("relation", "The source " + rel.source + " is not known: add it under “Sources”.");
      if (!str(rel.why).trim()) E("relation", "Say why it is this relation; without it the node answers Undefined.");
      if (!(P.inputs || []).length) E("inputs", "A computed node reads at least one input.");
      (P.inputs || []).forEach(function (i, n) {
        var w = "Input " + (n + 1);
        if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(str(i.binding))) E("inputs", w + ": give a binding name (letters, digits, _).");
        else if (bindings.indexOf(i.binding) >= 0) E("inputs", w + ": the binding " + i.binding + " is used twice.");
        bindings.push(i.binding);
        var src = NODES[i.from];
        if (!i.from) E("inputs", w + ": say which node it reads.");
        else if (!src) E("inputs", w + ": " + i.from + " is not a node the software has.");
        else {
          if (N && i.from === N.id) E("inputs", w + ": a node cannot read itself.");
          var layer = N ? N.layer : ((CAT.groups || []).filter(function (g) { return g[0] === R.placement.parent; })[0] || [])[3];
          if (layer && src.layer !== layer) E("inputs", w + ": " + i.from + " is in layer " + src.layer + "; layers meet only at the door and the interface nodes.");
          if (!i.type) E("inputs", w + ": say what quantity it must be.");
          else if (src.type && src.type !== i.type) E("inputs", w + ": " + i.from + " publishes " + src.type + ", not " + i.type + ".");
          else if (!src.type) W("inputs", w + ": " + i.from + " has no answer specified yet; the checker will hold this until it has.");
        }
      });
      if (!(P.steps || []).length) E("steps", "Give at least one step.");
      (P.steps || []).forEach(function (st, n) {
        if (!str(st.text).trim()) E("steps", "Step " + (n + 1) + ": say what it does.");
        if (st.physics && !PHYS[st.physics]) E("steps", "Step " + (n + 1) + ": " + st.physics + " is not in the physics library; clear it and describe the new function instead.");
        if (!st.physics && !str(st.new_function).trim()) E("steps", "Step " + (n + 1) + ": name a physics function, or describe the new one it needs.");
        if (st.physics && PHYS[st.physics] && st.call !== "slice" && PHYS[st.physics].args.length !== bindings.length && n === P.steps.length - 1) W("steps", "Step " + (n + 1) + ": " + st.physics + " takes " + PHYS[st.physics].args.length + " arguments; the node has " + bindings.length + " inputs.");
      });
      var last = (P.steps || [])[(P.steps || []).length - 1];
      if (last && o.symbol && last.binds !== o.symbol) E("steps", "The last step must bind the answer, " + o.symbol + ".");
      (P.fixtures || []).forEach(function (fx, n) {
        var w = "Test vector " + (n + 1);
        if (!fx.provenance) E("tests", w + ": say where the number comes from (provenance).");
        if (!fx.source) E("tests", w + ": cite the source.");
        else if (knownSources().indexOf(fx.source) < 0) E("tests", w + ": the source " + fx.source + " is not known.");
        if (!str(fx.where).trim()) E("tests", w + ": give the page, table or figure.");
        if (!num(fx.expect)) E("tests", w + ": the expected answer is not a number.");
        if (!(num(fx.tolerance) && Number(fx.tolerance) > 0)) E("tests", w + ": the tolerance must be a number above zero.");
        var keys = Object.keys(fx.inputs || {}).filter(function (x) { return fx.inputs[x] !== "" && fx.inputs[x] !== undefined; }).sort();
        if (JSON.stringify(keys) !== JSON.stringify(bindings.slice().sort())) E("tests", w + ": give exactly one input value per binding (" + bindings.join(", ") + ").");
        Object.keys(fx.inputs || {}).forEach(function (x) { if (fx.inputs[x] !== "" && !num(fx.inputs[x])) E("tests", w + ": input " + x + " is not a number."); });
      });
      if (!(P.fixtures || []).length) W("tests", "No test vector: the node's validation stays low until it has one from a cited page.");
      (P.theory || []).forEach(function (x, n) { if (!str(x.text).trim()) E("relation", "Derivation step " + (n + 1) + " is empty."); });
    } else if ((P.inputs || []).length) E("inputs", "A " + k + " node reads nothing; remove its inputs.");
    (P.assumptions || []).forEach(function (a, n) {
      if (!str(a.text).trim() || !str(a.fails_when).trim()) E("assumptions", "Assumption " + (n + 1) + ": say what is assumed and when that stops being true.");
    });
    var optionalValue = N && (N.supplied_by === "product" || N.supplied_by === "tuned");
    if (N && N.supplied_by === "evidence" && num(P.value)) E("value", "This value comes from finished campaigns; a form cannot set it.");
    if (N && N.supplied_by === "derisk" && num(P.value)) E("value", "This value is counted from the de-risking ledger; a form cannot set it.");
    if (N && N.supplied_by === "lab" && num(P.value)) E("value", "This value is a facility measurement from the lab file; a form cannot set it.");
    if (k === "declared" && !(N && N.case_key) && !(N && (N.supplied_by === "evidence" || N.supplied_by === "derisk" || N.supplied_by === "lab"))) {
      if (!num(P.value)) { if (!optionalValue) E("value", "Give the declared number."); }
      else {
        if (num(o.lower) && Number(P.value) < Number(o.lower)) E("value", "The value is below its lowest value.");
        if (num(o.upper) && Number(P.value) > Number(o.upper)) E("value", "The value is above its highest value.");
        var vs = (P.relation || {}).source;
        if (!vs) E("value", "Say where the number comes from.");
        else if (knownSources().indexOf(vs) < 0) E("value", "The source " + vs + " is not known: add it under “Sources”.");
      }
    }
    if (k === "required" && P.sense !== "<=" && P.sense !== ">=") E("value", "Say which way the requirement binds.");
    if (k === "achieved") {
      if (!(P.evidence || {}).metric) E("value", "Name the campaign metric that supplies it.");
      if (!((P.evidence || {}).rungs || []).length) E("value", "Name at least one rung that may supply it.");
    }
    var zwa = P.zero_when_absent;
    if (typeof zwa === "string") zwa = zwa.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    (zwa || []).forEach(function (z) { if (!(P.inputs || []).some(function (i) { return i.from === z; })) E("steps", "“Zero when absent” names " + z + ", which the node does not read."); });
    R.new_sources.forEach(function (x, n) {
      if (!/^[a-z0-9_]+$/.test(str(x.id))) E("sources", "New source " + (n + 1) + ": its id needs lower-case letters, digits and _.");
      else if (SOURCES[x.id]) E("sources", "The source " + x.id + " already exists; cite it instead of adding it.");
      if (!str(x.title).trim() || !str(x.where).trim()) E("sources", "New source " + (n + 1) + ": say what it is and exactly where.");
    });
    if (!str(R.attested_by).trim() && t !== "feedback" && t !== "other") W("who", "Nobody is named as having checked the maths: the node will run as UNCONFIRMED until someone does.");
    return out;
  }
  function completeness() {
    var must = 0, done = 0;
    function c(ok) { must++; if (ok) done++; }
    c(!!R.type); c(!!str(R.requested_by).trim());
    if (R.type === "change" || R.type === "new" || R.type === "confirm") c(!!str(R.reason).trim());
    if (R.type === "change" || R.type === "new") { c(!!str(D.believed).trim()); c(!!str(D.now_know).trim()); c(!!D.status); }
    if (editing()) {
      c(!!str(P.question).trim()); c(!!(P.output || {}).symbol); c(!!(P.output || {}).type); c(!!(P.output || {}).unit);
      if (kind() === "computed") { c(!!(P.relation || {}).expression); c(!!(P.relation || {}).source); c(!!(P.relation || {}).why); c((P.inputs || []).length > 0); c((P.steps || []).length > 0); }
      if (kind() === "declared" && !(N && (N.case_key || N.supplied_by))) c(num(P.value));
    }
    return must ? done / must : 1;
  }
  function refresh() {
    var c = changeList(), iss = problems(), errs = iss.filter(function (x) { return x.level === "error"; });
    var st = document.getElementById("status");
    st.textContent = c.length ? c.length + " change" + (c.length > 1 ? "s" : "") : (R.type === "feedback" ? F.feedback.length + " feedback" : R.type === "confirm" ? "confirmation" : "unchanged");
    st.className = "chip" + (c.length ? " changed" : "");
    var per = {};
    iss.forEach(function (x) { if (x.level === "error") per[x.where] = (per[x.where] || 0) + 1; });
    ["question", "answer", "inputs", "relation", "steps", "assumptions", "value", "tests", "sources", "who", "place", "feedback", "other", "request", "explain", "derisk"].forEach(function (id) {
      setCount(id, per[id] ? String(per[id]) : "", per[id] ? "bad" : "");
    });
    setCount("feedback", F.feedback.length ? String(F.feedback.length) : "", per.feedback ? "bad" : "");
    setCount("review", errs.length ? String(errs.length) : "✓", errs.length ? "bad" : "");
    var s = reviewCard;
    while (s.childNodes.length > 1) s.removeChild(s.lastChild);
    var pc = Math.round(completeness() * 100);
    s.appendChild(el("div", { class: "muted", text: "Filled: " + pc + "% of what this request needs" }));
    s.appendChild(el("div", { class: "meter" }, [el("div", { style: "width:" + pc + "%" })]));
    var ul = el("ul", { class: "issues" });
    if (!iss.length) ul.appendChild(el("li", { class: "ok" }, [el("span", { class: "ic", text: "✓" }), el("span", { text: "Ready to save and send." })]));
    iss.forEach(function (x) {
      ul.appendChild(el("li", { class: x.level }, [el("span", { class: "ic", text: x.level === "error" ? "!" : "i" }),
        el("span", null, [el("a", { href: "#" + x.where, text: x.text })])]));
    });
    s.appendChild(ul);
    if (errs.length) s.appendChild(el("p", { class: "tiny", text: "Items marked ! must be fixed: the checker will refuse the request with them. Items marked i are allowed, and are recorded." }));
    if (c.length) {
      s.appendChild(el("h3", { text: "What you are proposing" }));
      var t = el("table", { class: "diff" }), tr = el("tr");
      ["field", "now", "proposed"].forEach(function (h) { tr.appendChild(el("th", { text: h })); });
      t.appendChild(el("thead", null, [tr]));
      var tb = el("tbody");
      c.forEach(function (r) { tb.appendChild(el("tr", null, [el("td", { class: "mono", text: r[0] }), el("td", { class: "old", text: r[1] || "(empty)" }), el("td", { class: "new", text: r[2] || "(empty)" })])); });
      t.appendChild(tb); s.appendChild(el("div", { class: "scroll" }, [t]));
    }
    var acts = el("div", { class: "row-actions" }, [
      el("button", { class: "primary", text: "Save filled copy", onclick: save }),
      el("button", { text: "Download answers (JSON)", onclick: function () {
        download(new Blob([JSON.stringify({ schema: F.schema, base: F.base, node: N ? N.id : null, request: R, feedback: F.feedback }, null, 1)], { type: "application/json" }), fileStem() + ".answers.json");
      } })]);
    s.appendChild(acts);
    s.appendChild(el("p", { class: "tiny", text: "Next: send the saved file to the developer team (mail, chat, or attach it to an issue). They reply in this file's history, and the next release carries the change." }));
    if (c.length || F.feedback.length || str(R.reason) || str(R.requested_by)) {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ request: R, feedback: F.feedback, at: new Date().toISOString() })); } catch (e) { /* no storage: the saved file is the record */ }
    }
  }
  function fileStem() { return (N ? N.id : (R.placement.id || "new_node")); }
  function download(blob, name) {
    var a = el("a", { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function normalise() {
    if (typeof P.zero_when_absent === "string") P.zero_when_absent = P.zero_when_absent.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function save() {
    normalise();
    var json = JSON.stringify(F, null, 1).replace(/</g, "\\u003c");
    var open = '<script type="application/json" id="adcs-node-form">';
    var i = PRISTINE.indexOf(open), j = PRISTINE.indexOf("</" + "script>", i);
    var html = PRISTINE.slice(0, i + open.length) + "\n" + json + "\n" + PRISTINE.slice(j);
    download(new Blob([html], { type: "text/html" }), fileStem() + ".request." + new Date().toISOString().slice(0, 10) + ".html");
    toast("Saved a filled copy");
  }
  document.getElementById("save").onclick = save;

  // ------------------------------------------------------------------ draft recovery (a convenience; the file is the record)
  (function () {
    var d = SAVED_DRAFT;
    if (!d || (same(d.request, R) && same(d.feedback, F.feedback))) return;
    var b = document.getElementById("draft");
    b.appendChild(el("span", { text: "This browser kept unsaved answers for this form from " + str(d.at).slice(0, 16).replace("T", " ") + "." }));
    b.appendChild(el("button", { class: "primary", text: "Restore them", onclick: function () {
      var copy = PRISTINE.replace(/(<script type="application\/json" id="adcs-node-form">)[\s\S]*?(<\/script>)/, function (m, a, z) {
        var G = clone(F); G.request = d.request; G.feedback = d.feedback || [];
        return a + "\n" + JSON.stringify(G).replace(/</g, "\\u003c") + "\n" + z;
      });
      document.open(); document.write(copy); document.close();
    } }));
    b.appendChild(el("button", { text: "Discard", onclick: function () { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} b.classList.remove("on"); } }));
    b.classList.add("on");
  })();

  arrange();
  refresh();
})();
</script>
