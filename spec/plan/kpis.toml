# The 22 KPIs, each closed twice (SPEC.md §5.5).
#
# requirement  the tree row a customer writes (declared, with `sense`)
# evidence     the achieved row only a campaign can supply (an evidence row)
# analysis     the system-layer row that answers the KPI by analysis, or "none"
#              when no honest closed-form relation exists at system level.
#              This is the ANSWER, which is narrower than a contribution edge:
#              tree.json's KE edges say which variables feed a KPI (coverage),
#              and several KPIs with analysis = "none" still have them.
# metric       the metric kind a campaign computes for the evidence row (§10.3);
#              "inspection_*" rows are closed by weighing or measuring a unit,
#              not by a campaign.
# sense        the sense a requirement on this KPI is normally written in. The
#              written requirement's own `sense` is what the closure uses.
# slug         the closure rows are kpi_<slug>_analysis and kpi_<slug>_verified.
#
# `xtask draft` reads this file: when it writes a requirement row it also writes
# that KPI's two closures (the analysis one only when `analysis` is not "none"),
# with the seeder's KPI(), with the hole's Sense read from the requirement.

