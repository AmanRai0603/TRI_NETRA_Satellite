why = "A dipole in a field feels m x B, at most m B when the two are perpendicular. The strongest field along the orbit bounds it."

[[row]]
tree_id = "gd_4"
kind = "computed"
tier = "B"
question = "How large is the total disturbance torque at worst?"
expression = "tau_d = tau_gg + tau_a + tau_s + tau_m"
source = "smad2011"
