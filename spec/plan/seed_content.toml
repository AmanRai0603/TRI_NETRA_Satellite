# ------------------------------------------------ computed: disturbances ---

[[row]]
tree_id = "gd_0"
kind = "computed"
tier = "B"
question = "How large is the gravity-gradient torque at worst?"
expression = "tau_gg = 3*mu/(2*r^3)*|I_max - I_min|*sin(2*theta), theta = 45 deg"
source = "wertz1978"
physics = "gnc::gravity_gradient_torque_worst"
