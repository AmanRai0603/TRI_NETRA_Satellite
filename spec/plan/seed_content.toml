bundles = ["igrf14"]
symbol = "lambda_max"
type = "Angle"
unit = "Degree"
lower = 0.0
upper = 90.0
reason_lower = "a latitude magnitude is not negative"
reason_upper = "a latitude is at most 90 degrees"
inputs = [["i", "m2_1"]]
steps = ["fold the inclination into 0 to 90 degrees, add the dipole tilt at the epoch, and cap at the pole"]
why = "A dipole tilted by theta_dip from the spin axis lets an orbit of inclination i reach magnetic latitude i + theta_dip. The tilt comes from the degree-1 IGRF-14 coefficients, read from the igrf14 bundle, not typed here."
assumptions = [["the field is a tilted dipole", "the pointing budget needs the field direction to better than about 10 degrees, where higher-degree terms matter"]]

[[row]]
tree_id = "m3_0"
kind = "computed"
tier = "B"
question = "How weak does the field get along the orbit?"
expression = "B_min = B0*(R_E/r)^3"
