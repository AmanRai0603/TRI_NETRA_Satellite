[[row]]
tree_id = "m3_2"
kind = "computed"
tier = "B"
question = "How far from the magnetic equator does the orbit reach?"
expression = "lambda_max = min(90 deg, i' + theta_dip), i' = min(i, 180 deg - i)"
source = "igrf14"
