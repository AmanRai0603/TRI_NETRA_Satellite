# Seed content for node forms: the pilot thread's 61 rows and the risk
# branch's 21 (82 in all), written from cited sources so the first forms the
# developer team takes through intake are not blank (SPEC.md §5.8, §5.13).
#
# WHAT THIS FILE IS. Content, not code and not a sheet. `tools/forms.py` turns
# each row into that node's seed form (adcs-node-form/1). In the built
# repository the developer team takes every seed form through the same intake
# as a team member's form (SPEC.md §5.11): the checker, then the implementation
# agent, then verify, then review. Nothing is written to a sheet from here
# directly.
#
# WHO WROTE IT. The planning assistant that wrote this package, from the
# sources below. That is why every row reaches the repository with nobody's
# name on its relation or value: the seed forms leave `attested_by` empty, and
# the rows run as UNCONFIRMED until an engineer attests them in a node form.
#
# THE THREAD. One reference case, followed end to end before anything else is
# widened (VLEO RUNBOOK: "one node, all the way through"): the IDMAS v2 §13
# case, a 3U CubeSat in a 500 km sun-synchronous orbit with three panel rings
# plus coils. Orbit -> environment -> disturbances -> coil sizing -> ring
# sizing -> settling -> the APE budget. The RCS rows are included because
# IDMAS v2 §09 prints the numbers a test vector needs.
#
# RULES THIS FILE KEEPS (tools/validate_plan.py checks them):
# * Values are in the declared unit. Test-vector (fixture) `expect` and
#   `inputs` are SI, keyed by binding, exactly as fixtures.toml in VLEO.
# * Every test-vector value is TRANSCRIBED from a page of a cited source. None
#   was computed by the author of this file: a number computed by an assistant
#   is `agent-generated`, and the gate refuses it. Where a test vector is
#   wanted and no source prints the number, `fixture_wanted` says so; an
#   engineer supplies it in the node form, with the page it comes from.
#   Tolerances cover the source's printed rounding and nothing more.
# * Values on declared rows are the reference satellite's, never a
#   confirmation. They run as UNCONFIRMED until attested (SPEC.md §5.8).
# * A computed row carries `why`, which becomes `[theory] why`. Without
#   theory the engine answers Undefined.
# * `physics` names the adcs-core::physics function (plan/physics.toml) the
#   step calls, with the row's bindings in declared order; `call = "slice"`
#   passes them as one slice instead. A formula never appears in node code
#   (rule 3). Measured data a function needs (IGRF-14 terms, the density
#   table) is compiled into adcs-core from its bundle; `bundles` makes the run
#   refuse when that bundle is not the verified one.
# * The inputs of a row are exactly its VE edges in plan/tree.json.
# * `tier` sets the validation ceiling (VLEO credibility.rs): A for declared
#   rows, B for computed rows whose test vectors are independent-tool.
# * A row is named by its tree id (plan/tree.json).
#
# Every unit used here is in plan/units.toml.

# ---------------------------------------------------------------- sources ---

