reason_upper = "above 1000 s the bore is larger than any ring in the catalogue"
inputs = [["d", "gf_0"], ["rho", "gf_2"], ["mu", "gf_3"]]
steps = ["the laminar viscous time constant of a round channel"]
why = "Laminar wall friction in a round channel decays the flow with time constant rho d^2 / (32 mu) (IDMAS v2 §03B). It is why the ring is a torque device and not a store: a 3 mm channel coasts under a second."
assumptions = [["the flow is laminar", "the Reynolds number rho v d / mu exceeds about 2000, when turbulent losses shorten it"]]
# The worked example of the explanation standard (SPEC.md §5.12; manual/developer/07_explaining.md).
explain = { simply = "Stop the pump and the liquid metal in the ring keeps flowing for a moment, until friction at the channel wall brings it to rest. This node says how long that takes.", one_line = "How long a ring's flow coasts after the pump stops: density times bore squared, over 32 times viscosity.", wrong_idea = "A ring stores momentum like a reaction wheel, so it keeps holding the satellite's attitude after its pump stops.", wrong_because = "A wheel turns on bearings and coasts; the ring's fluid rubs on its whole wall. A 3 mm channel coasts in under a second (IDMAS v2 §03B), so the ring is a torque device, not a store: its pump holds the momentum, or the coils take it.", contrast = "Two rings, one difference, the bore: the same Galinstan ring coasts 21 s with a 16 mm channel and 0.75 s with a 3 mm one (IDMAS v2 §03B). The time goes with the bore squared.", analogy = "Stirred tea keeps turning after you take the spoon out, and slows as the cup's wall and bottom drag on it.", analogy_breaks = "The tea has a free surface and is not in a closed loop, and a stirred cup is rarely laminar. The ring is full, closed, and assumed laminar; that assumption is where this node stops being true.", why_chain = ["Why does a 3 mm ring coast for under a second? Friction at the wall removes its momentum fast.", "Why is that friction so strong? The flow's speed goes from zero at the wall to its peak within half a bore, so the shear is large.", "Why does the time go with the bore squared? The pressure a laminar flow loses per metre is 32 mu v / d^2, and that pressure is what slows the column.", "Floor: the Hagen-Poiseuille law of laminar pipe flow, which follows from Newton's law of viscosity."] }

