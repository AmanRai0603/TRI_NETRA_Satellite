why = "Radiation pressure on a perfect absorber is the irradiance over c. The irradiance at 1 AU is 1360.8 W/m2 (Kopp and Lean 2011); the Sun distance at the epoch comes from the low-precision solar ephemeris in adcs-core."

[[row]]
tree_id = "m3_3"
