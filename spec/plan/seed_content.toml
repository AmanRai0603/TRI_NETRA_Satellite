upper = 1.0e6
reason_lower = "a torque magnitude is not negative"
reason_upper = "above 1 N.m the bus is outside every catalogue family"
inputs = [["r", "m2_4"], ["i_max", "s1_1"], ["i_min", "s1_3"]]
steps = ["evaluate the gravity-gradient torque at the worst angle between the largest and smallest axes"]
why = "The gravity-gradient torque on a rigid body is 3 mu / (2 r^3) times the inertia difference times sin(2 theta), largest at theta = 45 degrees. Using the worst angle makes this a sizing bound; SILS evaluates the torque at the attitude actually flown."
assumptions = [["the body is rigid and the angle is at its worst", "the satellite holds a known attitude, when the real torque is smaller and the coils are oversized"]]

[[row]]
tree_id = "gd_1"
