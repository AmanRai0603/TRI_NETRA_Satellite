reason_upper = "above 60 uT the value exceeds the field at the surface"
inputs = [["r", "m2_4"]]
steps = ["scale the equatorial dipole strength at the epoch by the cube of the radius ratio"]
why = "A dipole field is weakest at the magnetic equator and falls as the cube of distance. B0 is the dipole strength from the degree-1 IGRF-14 coefficients at the epoch, read from the igrf14 bundle. The minimum is what sizes every coil, because authority is lowest there."
assumptions = [["the field is a dipole", "the orbit is low enough that the real minimum departs from the dipole's by more than 20 per cent; SILS uses the full IGRF-14 expansion and the parity ledger shows the gap"], ["the dipole strength is taken at the IGRF-14 model epoch 2025.0", "the launch epoch is far enough from 2025 that secular variation moves B0 by more than the margin this row feeds"]]

