unit = "MicronewtonMetre"
lower = 0.0
upper = 4.0e6
reason_lower = "a torque magnitude is not negative"
reason_upper = "above 4 N.m the sum of four bounded terms is exceeded"
inputs = [["tau_a", "gd_1"], ["tau_gg", "gd_0"], ["tau_s", "gd_2"], ["tau_m", "gd_3"]]   # VLEO gnc::total_disturbance_torque order
steps = ["sum the four worst-case torques linearly"]
why = "SMAD sizes against the linear sum of worst cases, because the torques are not independent random variables: they share the attitude and the orbit position. The sum is conservative."
assumptions = [["all four peak together", "a campaign shows they do not, when the coils are oversized by the difference"]]

[[row]]
tree_id = "gd_5"
