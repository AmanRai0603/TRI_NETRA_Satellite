unit = "MicronewtonMetre"
lower = 0.0
upper = 1.0e6
reason_lower = "a torque magnitude is not negative"
reason_upper = "above 1 N.m the bus is outside every catalogue family"
inputs = [["rho", "m3_3"], ["v", "m3_4"], ["c_d", "s2_5"], ["a_fr", "s2_0"], ["c_pa", "s2_1"]]
steps = ["dynamic pressure times drag coefficient times area times the centre-of-pressure offset"]
why = "In free-molecular flow the drag force is 0.5 rho v^2 C_D A, and it acts at the centre of pressure; the torque is that force times the offset to the centre of mass."
assumptions = [["the offset is perpendicular to the flow", "the attitude is known, when the real lever arm is shorter"]]

[[row]]
tree_id = "gd_3"
kind = "computed"
tier = "B"
question = "How large is the residual-magnetic torque at worst?"
expression = "tau_m = D_res*B_max"
