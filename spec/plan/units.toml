# The units and quantities a node may declare (SPEC.md §6.1).
#
# The first part is VLEO_SIMULATOR's vleo-units at abf79ee (unit.rs `units!`, quantity.rs
# QUANTITIES), copied; the part marked origin = "adcs" is §6.1's additions. In the built
# repository the registry is adcs-units itself and this file is not read; here it is what
# the form pick-lists and tools/intake.py check a node form against.
#
# `quantity` lists the quantities a unit may express. Dimension alone is not enough:
# Degree and One are both dimensionless, and an angle declared as a ratio is a fault.
# Every quantity SPEC.md §6.1 adds has at least one unit; tools/validate_plan.py checks it.

