# N2O cold-gas reaction control for a 3U (in-house development): six nozzle
# couples (a +/- pure torque about each body axis), 10 mN nozzles, 5 ms minimum
# impulse bit. Nitrous oxide stored as a self-pressurising liquid (vapour
# pressure ~50 bar at 20 C), expelled as cold gas: Isp 60-80 s (nominal 70 s).
# The case-sized unit is produced by asils.sizing.rcs; this is the reference.
part_number = "TRN-RCS-3U"
kind = "rcs"
name = "N2O cold-gas RCS, six couples — in-house reference"
status = "synthetic"
source = "sils_trade_study"
families = ["mtq_rw_rcs", "mtq_fmr_rcs"]
made = "in-house"
descriptor_version = 1

[nominal]
thrust_N = 0.010
isp_s = 70.0
propellant = "N2O"
tank_pressure_bar = 50.0
propellant_density_kg_m3 = 745.0   # liquid N2O at 25 C
thrusters = 12
mib_s = 0.005
valve_res_s = 0.001
arm_long_m = 0.15            # couples about Y and Z act on the 0.34 m axis
arm_short_m = 0.045          # couples about X act across the 0.1 m face
propellant_kg = 0.05
valve_power_W = 1.0
mass_kg = 0.35

[dispersion]
thrust_scale = { dist = "normal", mean = 1.0, sigma = 0.03 }
isp_s = { dist = "uniform", lo = 60.0, hi = 80.0 }
axis_misalignment_rad = { dist = "normal", mean = 0.0, sigma = 0.01 }
