# SYNTHETIC coil set driven directly by the OBC's H-bridges (PWM), so the PWM
# path is exercised. Its dipole matches IDM-CT-3U; its electrical values are
# invented round numbers. Tests and the machinery pilot only (SPEC.md §7.3).
part_number = "SYN-CT-1"
kind = "coil_tile"
name = "Synthetic PWM-driven coil, 3U class — tests only"
status = "synthetic"
source = "synthetic_test_parts"
families = ["mtq", "mtq_rw", "mtq_fmr"]
made = "in-house"
descriptor_version = 1

[nominal]
dipole_max_Am2 = 0.45
dipole_per_amp_Am2_per_A = 4.5
current_max_A = 0.1
resistance_ohm = 30.0
time_constant_s = 0.005
mass_kg = 0.03
power_at_max_W = 0.3

[dispersion]
dipole_scale = { dist = "normal", mean = 1.0, sigma = 0.02 }
axis_misalignment_rad = { dist = "normal", mean = 0.0, sigma = 0.005 }

[interface]
bus = "pwm"
eeprom = []
