# The flight-software parameter table (adcs-fswcfg/1): the ONE source of every
# parameter the flight software reads at init. tools/gen_fsw_params.py writes
#   fsw/include/adcs_params.h, fsw/src/adcs_params.c   (C struct + blob decoder)
#   fsw-rs/src/params.rs                               (Rust struct + decoder + encoder)
# and the engine encodes the blob with the same order. Blob layout:
#   "ADCSCFG1" | u32 payload length | fields in this order, little-endian | u32 CRC-32 (IEEE) of the payload
# type: f64 | u32 | u8 ; shape: [] scalar, [n] or [n, m] row-major.
# Values come from asils.config (MATLAB twin) / adcs_sim::config (Rust engine).
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.
schema = "adcs-fswcfg/1"
max_rotors = 8
max_gimbals = 4
max_couples = 6
max_heads = 2
max_schedule = 8

[[field]]
name = "jd0"
type = "f64"
doc = "Julian date of tick 0 (UTC ~ TT for the onboard models)"
[[field]]
name = "dt"
type = "f64"
doc = "flight-software tick [s]"
[[field]]
name = "mu"
type = "f64"
doc = "Earth gravitational parameter [m^3/s^2]"
[[field]]
name = "start_mode"
type = "u8"
doc = "controller state at init (adcs_mode_t)"
[[field]]
name = "auto_next"
type = "u8"
doc = "state entered when detumble / rotor Sun acquisition completes (255 = none)"
[[field]]
name = "n_sched"
type = "u8"
doc = "number of commanded mode changes"
[[field]]
name = "sched_t"
type = "f64"
shape = [8]
doc = "commanded change times [s]"
[[field]]
name = "sched_mode"
type = "u8"
shape = [8]
doc = "commanded states"
# ---- algorithm choices (registry slots, resolved on the ground)
[[field]]
name = "bdot_law"
type = "u8"
doc = "0 gyro, 1 mag, 2 bangbang, 3 L1 generalised B-dot"
[[field]]
name = "rw_law"
type = "u8"
doc = "fine pointing law: 0 pid, 1 lqr, 2 smc"
[[field]]
name = "mtq_law"
type = "u8"
doc = "magnetic pointing law: 0 pd, 1 lqr, 2 smc, 3 rate damping, 4 Lovera-Astolfi 2004, 5 Celani 2015, 6 Avanzini 2021 (nadir), 7 Celani 2026 boresight, 8 TANGO frozen-Riccati LQR"
[[field]]
name = "alloc"
type = "u8"
doc = "allocation: 0 rotor pinv, 1 IDMAS split, 2 CMG SR, 3 VSCMG SR"
[[field]]
name = "ss_eclipse"
type = "u8"
doc = "Sun spin eclipse policy: 1 E1 (coils off), 2 E2 (gyro-propagated Sun)"
[[field]]
name = "ss_rz_floor"
type = "f64"
doc = "Sun spin R_z floor as a fraction of J_zz (0 = published law)"
[[field]]
name = "ss_law"
type = "u8"
doc = "coils-only Sun acquisition: 0 He et al. 2023 Sun spin, 1 de Ruiter 2011 spin law on the Sun line, 2 Celani 2026 boresight on the Sun (no spin)"
