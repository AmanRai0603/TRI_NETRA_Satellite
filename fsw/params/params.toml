[[field]]
name = "start_mode"
type = "u8"
doc = "controller state at init (adcs_mode_t)"
mode = "valid"
[[field]]
name = "auto_next"
type = "u8"
doc = "state entered when detumble / rotor Sun acquisition completes (255 = none)"
