# The flight-software parameter table (adcs-fswcfg/1): the ONE source of every
# parameter the flight software reads at init. tools/gen_fsw_params.py writes
#   fsw/include/adcs_params.h, fsw/src/adcs_params.c   (C struct + blob decoder)
#   fsw-rs/src/params.rs                               (Rust struct + decoder + encoder)
# and the engine encodes the blob with the same order. Blob layout:
#   "ADCSCFG1" | u32 payload length | fields in this order, little-endian | u32 CRC-32 (IEEE) of the payload
# type: f64 | u32 | u8 ; shape: [] scalar, [n] or [n, m] row-major.
# Rules the flight software checks after decoding (adcs_params_validate / Params::validate), both
# generated from here: every f64 finite, no larger than 1e15 and, when not 0, no smaller than 1e-30
# (in magnitude); min / max (inclusive); positive (> 0); mode = "valid" (a
# controller state) or "or_none" (also 255); max_field (at most another field's value); diag_positive
# (a matrix's diagonal > 0); upto = "<count>" (arrays: only the first <count> entries); when =
# "<count>" (only when that count is above 0); unit = "required" | "or_zero" (an axis or a
# quaternion of unit length, rows of a matrix each; or_zero also takes all zeros: unset). A blob
# that breaks one is refused at init.
# Values come from asils.config (MATLAB twin) / adcs_sim::config (Rust engine).
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.
schema = "adcs-fswcfg/1"
max_rotors = 8
max_gimbals = 4
max_couples = 6
max_heads = 2
max_schedule = 8

[[field]]
