# Wheels + RCS 3U on the imaging case: detumble on the thrusters from the separation tumble
# (case mission.w0), judged against the case's detumble time; the propellant it costs reported.
schema = "adcs-scenario/1"
id = "detumble_rcs"
label = "3U imaging, wheels + RCS — detumble on the thrusters from the separation tumble"
case = "ais_img_3u"
product = "TRN-P-3U-RW-RCS"
[time]
duration_s = 1800.0
dt_s = 0.1
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = "case:mission.w0" }
[fsw]
start_mode = "detumble_rcs"
guidance = { kind = "nadir" }
[[metrics]]
id = "detumble_time"
kind = "time_to_rate"
rate_threshold_deg_s = 0.5
hold_s = 60.0
requirement = "req.detumble"
[[metrics]]
id = "propellant"
kind = "propellant"
window = "all"
diagnostic = "the propellant a thruster detumble costs: the case states no propellant budget (req.prop)"
