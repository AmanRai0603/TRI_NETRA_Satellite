# AIS 3U, coils only: the Standard Code Sun-acquisition chain.
# Detumble (L1, w_d = 0) -> SpinUp (L1, w_d = sigma 6 deg/s e_z, G_sigma flip)
# -> SunSpin (L2, He et al. 2023: -Z_B held on the Sun while spinning),
# guards from the theory doc sec. 7. No attitude solution is used at all:
# a safe/power-positive mode for a coils-only bus.
schema = "adcs-scenario/1"
id = "sun_spin_ais"
label = "3U AIS — coils-only Sun acquisition: detumble, spin-up, Sun-pointing spin"
case = "ais_3u"
product = "TRN-P-3U-AIS"
[time]
duration_s = 17220.0          # three orbits
dt_s = 0.2
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = "case:mission.w0" }
[fsw]
algorithms = { detumble = "genbdot_l1", sun_spin = "sunspin_l1l2" }
start_mode = "detumble"
auto_next = "spinup"
detumble_exit_deg_s = 2.0
detumble_hold_s = 60.0
guidance = { kind = "nadir" }
[[metrics]]
id = "sun_spin_entry"
kind = "time_to_mode"
mode = "sun_spin"
requirement = "req.sunacq"    # one orbit to acquire, as the case states (95 min)
[[metrics]]
id = "sun_angle_last_orbit"
kind = "sun_angle"
window = "last_orbit"
statistic = "p95"
limit = 20.0                  # theta_ok of the theory doc guards
[[metrics]]
id = "spin_rate_error_last_orbit"
kind = "spin_rate_error"
window = "last_orbit"
statistic = "mean"
limit = 0.5
[[metrics]]
id = "sun_spin_share_last_orbit"
kind = "mode_fraction"
mode = "sun_spin"
window = "last_orbit"
limit = 90.0
sense = "min"
[[metrics]]
id = "power_mean"
kind = "power_mean"
window = "all"
requirement = "req.pavg"
