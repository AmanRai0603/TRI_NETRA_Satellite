# AIS 3U end-to-end: tumble -> B-dot -> automatic switch to magnetic nadir hold.
schema = "adcs-scenario/1"
id = "mission_ais"
label = "3U AIS — integrated chain: detumble then nadir hold (auto mode switch)"
case = "ais_3u"
product = "TRN-P-3U-AIS"
[time]
duration_s = 28700.0          # five orbits
dt_s = 0.2                    # magnetic control is slow; the 1 s coil duty still resolves
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = "case:mission.w0" }
[fsw]
start_mode = "detumble"
auto_next = "nadir_mtq"
detumble_exit_deg_s = 0.3
detumble_hold_s = 120.0
guidance = { kind = "nadir" }
[[metrics]]
id = "detumble_time"
kind = "time_to_rate"
rate_threshold_deg_s = 0.5
hold_s = 600.0
requirement = "req.detumble"
[[metrics]]
id = "ape_los_last_orbit"
kind = "ape_los"
window = "last_orbit"
statistic = "max"
requirement = "req.ape"

[[metrics]]
id = "ape_3axis_last_orbit"
kind = "ape"
window = "last_orbit"
statistic = "max"
diagnostic = "yaw about the antenna axis is not required: the line of sight is judged (ape_los_last_orbit)"
[[metrics]]
id = "ake_los_last_orbit"
kind = "ake_los"
window = "last_orbit"
statistic = "max"
requirement = "req.ake"
[[metrics]]
id = "power_margin_last_orbit"
kind = "power_margin"
window = "last_orbit"
limit = 0.0
sense = "min"                # energy-positive: over an orbit the arrays give at least what everything draws
[[metrics]]
id = "battery_dod_last_orbit"
kind = "battery_dod"
window = "last_orbit"
diagnostic = "the deepest battery discharge over the orbit: the case does not state a depth-of-discharge limit"
