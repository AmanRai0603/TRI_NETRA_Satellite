# adcs-scenario/1: the source of matlab_sils/data/scenarios/detumble_ais_mag.json; export_catalogue.py writes the JSON from it.
case = "ais_3u"
id = "detumble_ais_mag"
label = "3U AIS — detumble, B-dot law mag"
product = "TRN-P-3U-AIS"
schema = "adcs-scenario/1"

[fsw]
bdot_gain_scale = 3.0
start_mode = "detumble"

[fsw.algorithms]
detumble = "bdot_mag"

[fsw.guidance]
kind = "nadir"

[initial]

[initial.attitude]
kind = "random"

[initial.rate]
kind = "random_direction"
magnitude_deg_s = "case:mission.w0"

[time]
dt_s = 0.2
duration_s = 17220.0
record_dt_s = 1.0

[[metrics]]
hold_s = 600.0
id = "detumble_time"
kind = "time_to_rate"
rate_threshold_deg_s = 0.5
requirement = "req.detumble"

[[metrics]]
id = "power_mean"
kind = "power_mean"
requirement = "req.pavg"
window = "all"

[[metrics]]
id = "power_peak"
kind = "power_peak"
requirement = "req.ppk"
window = "all"
