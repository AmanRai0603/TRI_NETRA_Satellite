# Imaging 3U: Sun acquisition on the wheels from an arbitrary attitude (the rotor safe mode):
# judged on bringing the power face to the Sun within the case's Sun-acquisition time.
schema = "adcs-scenario/1"
id = "sun_acq_rotor_img"
label = "3U imaging — Sun acquisition on reaction wheels from an arbitrary attitude"
case = "ais_img_3u"
product = "TRN-P-3U-IMG"
[time]
duration_s = 5740.0
dt_s = 0.1
record_dt_s = 1.0
[initial]
attitude = { kind = "random" }
rate = { kind = "random_direction", magnitude_deg_s = 0.5 }
[fsw]
start_mode = "sun_acq_rotor"
guidance = { kind = "sun" }
rw_bandwidth = 0.9
rw_damping = 2.0
[[metrics]]
id = "sun_acquisition_time"
kind = "time_to_threshold"
channel = "sun_angle_geo"
threshold_deg = 20.0
hold_s = 600.0
unit_min = true
requirement = "req.sunacq"
[[metrics]]
id = "power_margin_orbit"
kind = "power_margin"
window = "all"
diagnostic = "the orbit that includes the acquisition: a deficit here is drawn from the battery"
[[metrics]]
id = "battery_dod_orbit"
kind = "battery_dod"
window = "all"
diagnostic = "the deepest discharge of the acquisition orbit: the case does not state a depth-of-discharge limit"
