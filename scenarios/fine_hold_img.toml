# Imaging 3U: fine nadir hold with wheels + star tracker + MEKF from a 2 deg
# error; APE / AKE (3-sigma = 99.73 % temporal) over the last half orbit.
schema = "adcs-scenario/1"
id = "fine_hold_img"
label = "3U imaging — fine nadir hold, reaction wheels + star tracker (0.01 deg)"
case = "ais_img_3u"
product = "TRN-P-3U-IMG"
[time]
duration_s = 5740.0           # one orbit
dt_s = 0.1
record_dt_s = 0.1
[initial]
attitude = { kind = "error_from_target", angle_deg = 2.0, axis_body = [0.577, 0.577, 0.577] }
rate = { kind = "lvlh" }
[fsw]
start_mode = "nadir_fine"
guidance = { kind = "nadir" }
rw_bandwidth = 0.9
rw_damping = 2.0
rw_rate_hz = 10.0
[[metrics]]
id = "ape_los_p9973"
kind = "ape_los"
window = "last_half_orbit"
statistic = "p99.73"
requirement = "req.ape"
[[metrics]]
id = "ape_los_max"
kind = "ape_los"
window = "last_half_orbit"
statistic = "max"
diagnostic = "the worst sample, beside the judged p99.73: req.ape is a 3-sigma requirement"
[[metrics]]
id = "ape_3ax_p9973"
kind = "ape"
window = "last_half_orbit"
statistic = "p99.73"
diagnostic = "the three-axis error, beside the judged line of sight: req.ape is on the imager's line of sight"
[[metrics]]
id = "ake_los_p9973"
kind = "ake_los"
window = "last_half_orbit"
statistic = "p99.73"
requirement = "req.ake"
[[metrics]]
id = "rate_stability_p9973"
kind = "rate_stability"
window = "last_half_orbit"
statistic = "p99.73"
requirement = "req.rks"
[[metrics]]
id = "time_to_0p01_deg"
kind = "time_to_threshold"
channel = "ape_los"
threshold_deg = 0.01
hold_s = 60.0
diagnostic = "acquisition from the initial error: no requirement states it (req.settle is after a slew)"
[[metrics]]
id = "wheel_momentum_peak"
kind = "wheel_momentum_peak"
window = "all"
diagnostic = "momentum used, for sizing: the case does not state the margin req.hsat"
[[metrics]]
id = "power_mean"
kind = "power_mean"
window = "all"
requirement = "req.pavg"
[[metrics]]
id = "rpe_los_10s_p9973"
kind = "rpe_los"
window = "last_half_orbit"
statistic = "p99.73"
delta_s = 10.0
diagnostic = "ECSS relative pointing error over 10 s windows: the case does not state req.rpe"
[[metrics]]
id = "pde_los_10s_60s_max"
kind = "pde_los"
window = "last_half_orbit"
statistic = "max"
delta_s = 10.0
separation_s = 60.0
diagnostic = "ECSS pointing drift between 10 s windows 60 s apart: the case does not state req.pde"
[[metrics]]
id = "rke_los_10s_p9973"
kind = "rke_los"
window = "last_half_orbit"
statistic = "p99.73"
delta_s = 10.0
diagnostic = "ECSS relative knowledge error over 10 s windows: the case does not state req.rke"
[[metrics]]
id = "power_margin_last_orbit"
kind = "power_margin"
window = "last_orbit"
limit = 0.0
sense = "min"                # energy-positive: over an orbit the arrays give at least what everything draws
[[metrics]]
id = "battery_dod_last_orbit"
kind = "battery_dod"
window = "last_orbit"
diagnostic = "the deepest battery discharge over the orbit: the case does not state a depth-of-discharge limit"
