# A release: push a tag vX.Y.Z whose version is the one in VERSION.
#
#   prove        the tag is VERSION, and every check passes, none of them NOT RUN (--strict)
#   firmware     the flight software on a virtual Cortex-M4, C and Rust against their in-process
#                builds (as CI's job of the same name)
#   twin         the MATLAB twin's suites in GNU Octave (as CI's job of the same name)
#   linux        adcs + the desktop app, the Linux kit
#   windows      cross-built with MinGW GCC (the compiler the flight software's parity rests
#                on), with the app's icon and version information; signed when a certificate
#                is configured; then run on a real Windows machine before it is published
#   macos        arm64 (and x86_64, for the wheel), the macOS kit and TRI-NETRA ADCS.app,
#                signed with a Developer ID and notarised when configured, ad hoc otherwise
#   wheel        one trinetra_adcs-<v>-py3-none-any.whl carrying every system's programs,
#                installed and run before it is published
#   publish      the GitHub release: every kit, the app, the wheel, the MATLAB SILS zip, the
#                flight-software zip and the V&V report, with SHA256SUMS.txt
#
# Signing switches on by itself when its secrets exist (docs/RELEASE_SETUP.md); without them
# the programs ship unsigned and docs/FIRST_RUN.md says what the first start asks.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - id: v
        name: the version is VERSION, and a tag names it
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v$v (VERSION)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: the ARM compiler, for the stack check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: every check, none of them NOT RUN
        run: |
          python3 -m pip install -q -r tools/requirements-ci.txt
          python3 tools/check_all.py --strict

  firmware:
    needs: prove
    name: the flight software on a virtual Cortex-M4 (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            engine
            fsw-rs
      - name: the ARM compiler and QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - name: the firmware (C and Rust), the OBC processes and the instruction counter
        run: make -C fsw obc
      - name: the deepest stack fits the stack the firmware reserves (no recursion)
        run: python3 tools/check_all.py --only fsw-stack
      - name: the engine
        run: cargo build --locked --release --manifest-path engine/Cargo.toml
      - name: C in-process against C on QEMU, and Rust in-process against Rust on QEMU
        run: |
          engine/target/release/adcs parity nadir_hold_ais --fsw c --against qemu --set engine.duration_s=300
          engine/target/release/adcs parity nadir_hold_ais --fsw rust --against qemu-rs --set engine.duration_s=300


  twin:
    needs: prove
    name: the MATLAB twin in GNU Octave
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: GNU Octave, with the gnuplot and the font its figures need (Octave recommends both)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave gnuplot-nox fonts-freefont-otf
      - name: the twin's suite and the propagator's regression suite
        run: python3 tools/check_all.py --only twin propagator

  linux:
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: build
        run: cargo build --locked --release --manifest-path engine/Cargo.toml -p adcs-cli -p trinetra-app
      - name: the kit
        run: |
          k="trinetra-adcs-${{ needs.prove.outputs.version }}-linux-x86_64"
          python3 tools/kit.py --bin engine/target/release --out "kit/$k"
          (cd /tmp && "$GITHUB_WORKSPACE/kit/$k/adcs" run nadir_hold_ais --set engine.duration_s=300 --quiet)
          (cd kit && zip -qr "../$k.zip" "$k")
          mkdir -p bin && cp engine/target/release/adcs engine/target/release/trinetra-app bin/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-linux
          path: trinetra-adcs-*-linux-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-linux-x86_64
          path: bin/

  windows:
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu
      - name: MinGW GCC (and osslsigncode, for signing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 osslsigncode
      - name: build
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --locked --release --manifest-path engine/Cargo.toml --target x86_64-pc-windows-gnu -p adcs-cli -p trinetra-app
      - name: sign, when a certificate is configured
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX" ]; then echo "no WINDOWS_CERT_PFX secret: the programs ship unsigned (docs/RELEASE_SETUP.md)"; exit 0; fi
          echo "$PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          for exe in adcs trinetra-app; do
            f="engine/target/x86_64-pc-windows-gnu/release/$exe.exe"
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$PFX_PASSWORD" -h sha256 \
              -n "TRI-NETRA ADCS" -t http://timestamp.digicert.com -in "$f" -out "$f.signed"
            mv "$f.signed" "$f"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"
      - name: the kit
        run: |
          k="trinetra-adcs-${{ needs.prove.outputs.version }}-windows-x86_64"
          python3 tools/kit.py --bin engine/target/x86_64-pc-windows-gnu/release --out "kit/$k"
          (cd kit && zip -qr "../$k.zip" "$k")
          mkdir -p bin && cp engine/target/x86_64-pc-windows-gnu/release/adcs.exe engine/target/x86_64-pc-windows-gnu/release/trinetra-app.exe bin/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-windows
          path: trinetra-adcs-*-windows-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-windows-x86_64
          path: bin/

  windows-run:
    name: the Windows kit, run on Windows
    needs: [prove, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kit-windows
      - name: fly, compare C with Rust, start and quit the app
        env:
          TRINETRA_NO_BROWSER: "1"
        run: |
          k="trinetra-adcs-${{ needs.prove.outputs.version }}-windows-x86_64"
          7z x -y "$k.zip" > /dev/null
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$k/adcs.exe" run nadir_hold_ais --set engine.duration_s=300 --quiet
          "$GITHUB_WORKSPACE/$k/adcs.exe" parity nadir_hold_ais --set engine.duration_s=300
          "$GITHUB_WORKSPACE/$k/TRI-NETRA ADCS.exe" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7788/v1/version && break; sleep 1; done
          curl -sf http://127.0.0.1:7788/v1/version | grep '"app":"trinetra"'
          curl -sf -X POST -H "X-Trinetra: 1" http://127.0.0.1:7788/v1/quit

  macos:
    needs: prove
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-apple-darwin
      - name: build (arm64, and x86_64 for the wheel)
        run: |
          cargo build --locked --release --manifest-path engine/Cargo.toml -p adcs-cli -p trinetra-app
          cargo build --locked --release --manifest-path engine/Cargo.toml --target x86_64-apple-darwin -p adcs-cli -p trinetra-app
      - name: the kit and the app
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          v="${{ needs.prove.outputs.version }}"
          k="trinetra-adcs-$v-macos-arm64"
          python3 tools/kit.py --bin engine/target/release --out "kit/$k"
          (cd /tmp && "$GITHUB_WORKSPACE/kit/$k/adcs" run nadir_hold_ais --set engine.duration_s=300 --quiet)
          python3 tools/macapp.py --kit "kit/$k" --out app
          a="app/TRI-NETRA ADCS.app"
          if [ -n "$P12" ] && [ -n "$IDENTITY" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p ci "$kc"
            echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
            security list-keychains -d user -s "$kc"
            codesign --force --options runtime --timestamp -s "$IDENTITY" "kit/$k/adcs" "kit/$k/trinetra-app"
            codesign --force --deep --options runtime --timestamp -s "$IDENTITY" "$a"
            if [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; then
              ditto -c -k --keepParent "$a" "$RUNNER_TEMP/notarise.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
              xcrun stapler staple "$a"
            fi
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "no Apple signing secrets: signed ad hoc (docs/RELEASE_SETUP.md)"
            codesign --force -s - "kit/$k/adcs" "kit/$k/trinetra-app"
            codesign --force --deep -s - "$a"
          fi
          codesign --verify --deep --strict "$a"
          (cd kit && ditto -c -k --keepParent "$k" "../$k.zip")
          ditto -c -k --keepParent "$a" "TRI-NETRA-ADCS-$v-macos-arm64.zip"
          mkdir -p bin-arm64 bin-x86_64
          cp engine/target/release/adcs engine/target/release/trinetra-app bin-arm64/
          cp engine/target/x86_64-apple-darwin/release/adcs engine/target/x86_64-apple-darwin/release/trinetra-app bin-x86_64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-macos
          path: |
            trinetra-adcs-*-macos-arm64.zip
            TRI-NETRA-ADCS-*-macos-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-macos-arm64
          path: bin-arm64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-macos-x86_64
          path: bin-x86_64/

  wheel:
    needs: [prove, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
      - name: one package for every computer, installed and run
        run: |
          python3 tools/kit.py --files-only --out wheel-kit
          chmod +x bin-*/adcs bin-*/trinetra-app 2>/dev/null || true
          python3 tools/build_wheel.py --kit wheel-kit --out . \
            --bin linux-x86_64=bin-linux-x86_64 --bin windows-x86_64=bin-windows-x86_64 \
            --bin macos-arm64=bin-macos-arm64 --bin macos-x86_64=bin-macos-x86_64
          python3 -m venv venv
          venv/bin/pip install -q trinetra_adcs-*-py3-none-any.whl
          (cd /tmp && TRINETRA_STORE="$RUNNER_TEMP/store" "$GITHUB_WORKSPACE/venv/bin/trinetra-adcs" run nadir_hold_ais --set engine.duration_s=300 --quiet)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel
          path: trinetra_adcs-*-py3-none-any.whl

  publish:
    needs: [prove, firmware, twin, linux, windows, windows-run, macos, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{kit-*,wheel}"
          merge-multiple: true
          path: out
      - name: the MATLAB SILS and flight-software zips, the V&V report, the checksums
        run: |
          python3 tools/pack_matlab.py
          python3 tools/pack_flight.py
          cp dist/TRINETRA_ADCS_SILS_matlab_*.zip dist/TRINETRA_ADCS_flight_engine_*.zip dist/TRINETRA_ADCS_VV_report.pdf out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: TRI-NETRA ADCS ${{ needs.prove.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: out/*
