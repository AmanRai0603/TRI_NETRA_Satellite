[package]
name = "adcs-fsw"
version = "1.0.0"
edition = "2021"
authors = ["Agastya"]
description = "TRI-NETRA ADCS flight software in Rust (no_std), the twin of fsw/ (C99) over the same pseudocode, parameter blob and byte HAL"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["std"]
# host builds use the platform libm (bit-identical to the C build on the same host)
std = []
# export adcs_fsw_init/step/command/peek/build_id over extern "C" adcs_hal_* (drop-in for libadcs_fsw.a)
cabi = []

[dependencies]
libm = "0.2"

[profile.release]
opt-level = 2
panic = "abort"
[profile.dev]
panic = "abort"
