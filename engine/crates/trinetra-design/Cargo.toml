[package]
name = "trinetra-design"
description = "TRI-NETRA design files (design/schema.toml): open a node, group, release or design file, check its format and tables, read its rows"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
pbkdf2 = { version = "0.12", features = ["hmac"] }
# bundled: SQLite compiled in, nothing to install (the same as the results index)
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
