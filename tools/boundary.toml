# ------------------------------------------------------------------ declared exceptions: relations still in code
[[allow]]
file = "matlab_sils/pop/*"
find = "any"
exception = true
why = "the vendored Octave POP carries its own published models (gravity, the atmospheres, DE440's evaluation, frames and time, tides, relativity, the spacecraft forces), and the twin's in-loop precision orbit (+asils/+orbit init, node, advance) flies them; only its force set and start are env's generated (forcemodel)."
until = "the twin's precision orbit flies env's generated +models, as the engine's adcs-pop calls its gen modules, and POP stays only as the referent (classified test)"
