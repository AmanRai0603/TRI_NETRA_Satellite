# The database/code boundary, as tools/boundary.py checks it (docs/PLAN_2_0.md S7 done-when; docs/CODE_ARCHITECTURE.md §1).
#
# Every source file of the code is either generated from the design (`[[generated]]`: its generator's --check holds it
# to the design, and it says so in its first lines) or hand-written and classified here (`[[part]]`, the first glob that
# matches; `*` crosses folders). A class says what part of the code a file is (docs/PLAN_2_0.md, "The code, as 2.0.0
# arranges it"); there is no class for a relation, a published model or a flight algorithm: those are design, and reach
# the code only generated. Every classified file but a test is searched for the marks of a relation or a published model
# (tools/boundary.py MARKS, and tables); a find is allowed only by an `[[allow]]` with its reason. An allowance that is a
# relation still in code is a declared exception (`exception = true`), with what removes it (`until`); the check prints
# every one of them on every run, so none is forgotten.
# Owner: Agastya. Copyright (c) 2026 Agastya. All rights reserved.

schema = "trinetra-boundary/1"
scope = ["engine/crates", "fsw", "fsw-rs", "matlab_sils", "tools", "python/trinetra_adcs", "design/js"]
extensions = [".rs", ".c", ".h", ".m", ".py", ".js", ".mjs"]
skip = ["*/target/*", "*/build/*", "*/node_modules/*", "matlab_sils/store/*"]

[classes]
toolbox = "the maths the methods may call, with units, and nothing that is a model of the world or the spacecraft (vectors, matrices, quaternions, libm, random streams, integrators, linear and Riccati solvers, units)"
reader = "reads a file's format (SQLite, DAF/SPK, CSV, the space-weather, EOP, gravity and tide files) and hands its numbers on; never a model of its own"
core = "the time engine's core and the twin's runner: step order, the calls to the generated models, the recorder, results, campaigns, figures"
runtime = "the flight software's runtime: HAL, C interface, tick and scheduler, the configuration blob's format, the targets; the algorithms it calls are generated"
rig = "the rigs: soft OILS, the byte link, the rig host, emulation channels"
translator = "the interpreter and the translators of the pseudocode (Rust, C, MATLAB)"
library = "reads, writes and checks every file kind; the design graph; today's design; the health map; signing"
application = "the application and the pages"
cli = "the command line and the Python package: scripted use over the engine and the library"
tools = "the developer's tools: generators, checks, the release, reports; they ask the engine or the interpreter for a design's relation"
test = "a test; a fixture may hold a published value (docs/CODE_ARCHITECTURE.md §1), so a test is classified, not searched"
vendored = "a third-party program kept whole beside the code"

